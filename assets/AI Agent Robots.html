<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Agent Robots</title>
<style>
:root{--bg:#0a0e1a;--panel:#121a2c;--line:#26314a;--text:#eef2ff;--sub:#8a93b3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Inter,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{max-width:1300px;margin:0 auto;padding:26px 18px 44px}
h1{font-size:20px;margin:0 0 4px}
.sub{font-size:12px;color:var(--sub)}
h2{font-size:14px;margin:0 0 12px;color:var(--sub);font-weight:600}
.section{margin-top:28px}
.hero{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:center}
.hero .portrait{width:220px}
.hero-info{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.hero-info .row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hero-info strong{font-size:17px}
.status-dot{width:8px;height:8px;border-radius:50%}
.desc{color:var(--sub);font-size:12.5px;line-height:1.5;margin:8px 0 12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tool{font-size:11px;background:#0d1626;border:1px solid var(--line);padding:5px 10px;border-radius:8px;color:var(--sub)}
.quote{font-size:12px;font-style:italic;color:#c9d3ec;border-left:2px solid var(--accent,#7c5cff);padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 10px 12px;text-align:center;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .portrait{width:88px;margin:0 auto 8px}
.card strong{display:block;font-size:13px}
.card span.role{display:block;font-size:10px;color:var(--sub);margin:2px 0 8px}
.state{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--sub)}
.state i{width:6px;height:6px;border-radius:50%}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.msg{display:flex;gap:8px;margin-bottom:12px}
.avatar-sm{width:26px;height:26px;border-radius:50%;flex:none;overflow:hidden}
.bubble{background:#0d1626;border-radius:0 10px 10px 10px;padding:8px 11px;font-size:12px;max-width:80%}
.msg-name{font-size:11px;color:var(--sub);margin-bottom:3px}
.legend-item{display:flex;align-items:center;gap:9px;margin-bottom:11px;font-size:12.5px}
.legend-item i{width:9px;height:9px;border-radius:50%;flex:none}
.legend-item small{display:block;color:var(--sub);font-size:10.5px}
.controls{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
button{background:#131c30;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 14px;cursor:pointer;font-size:13px}
button:hover{background:#1b2740}
button.primary{background:#6a4de0;border-color:#8569f0}
.blink{animation:blink 2.4s infinite}
@keyframes blink{0%,90%,100%{opacity:1}95%{opacity:.15}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mini-grid.expr{grid-template-columns:repeat(5,1fr)}
.mini-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.mini-card .portrait{width:64px;margin:0 auto 8px;perspective:300px}
.mini-card span{font-size:11px;color:var(--sub)}
.view-side svg{transform:rotateY(28deg)}
.view-back svg{transform:rotateY(180deg)}
.walking .legL{animation:legL .5s infinite alternate;transform-origin:55px 158px}
.walking .legR{animation:legR .5s infinite alternate;transform-origin:85px 158px}
.walking .armL{animation:armL .5s infinite alternate;transform-origin:22px 102px}
.walking .armR{animation:armR .5s infinite alternate;transform-origin:118px 102px}
@keyframes legL{to{transform:rotate(20deg)}}
@keyframes legR{to{transform:rotate(-20deg)}}
@keyframes armL{to{transform:rotate(-16deg)}}
@keyframes armR{to{transform:rotate(16deg)}}
.waving .armR{animation:wave 1s infinite;transform-origin:118px 102px}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-55deg)}}
.talking .mouth{animation:talk .6s infinite;transform-origin:70px 144px}
@keyframes talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2)}}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr}.hero .portrait{margin:0 auto}.two-col{grid-template-columns:1fr}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <h1>AI Agent Robots</h1>
  <div class="sub">Robot avatars for the Agent Office</div>
  <div class="section hero" id="hero"></div>
  <div class="section two-col">
    <div class="panel"><h2>Character Views</h2><div class="mini-grid" id="views"></div></div>
    <div class="panel"><h2>Expression / Status Variants</h2><div class="mini-grid expr" id="exprs"></div></div>
  </div>
  <div class="section panel"><h2>Animations / Poses</h2><div class="mini-grid" style="grid-template-columns:repeat(4,1fr)" id="poses"></div></div>
  <div class="section"><h2>Agent Team</h2><div class="grid" id="grid"></div></div>
  <div class="section two-col">
    <div class="panel"><h2>In Action</h2><div id="chat"></div></div>
    <div class="panel"><h2>Agent Status Indicators</h2><div id="legend"></div></div>
  </div>
  <div class="controls">
    <button class="primary" onclick="bobAll()">🤖 Power up</button>
    <button onclick="talkAll()">💬 Team collaboration</button>
  </div>
</div>
<script>
const agents=[
 {name:"Mia",role:"Communication Agent",status:"Working",accent:"#8b6bff",body:"#6c53d8",body2:"#4a3699",
  desc:"Handles emails, drafts responses, and manages communications. Can also handle meeting summaries and follow-ups.",
  tools:["Gmail","Calendar","Knowledge Base"],quote:"Keeping everyone connected!",line:"Can you check the project information?"},
 {name:"Ada",role:"Project Manager",status:"Thinking",accent:"#3fd08f",body:"#1fa872",body2:"#127653",
  desc:"Coordinates timelines, tracks tasks across agents, and keeps the whole team aligned on priorities.",
  tools:["Tasks","Calendar","Reports"],quote:"Sure, I'll check and get back to you.",line:"Sure, I'll check and get back to you."},
 {name:"Kai",role:"Code Developer",status:"Coding",accent:"#4d9bee",body:"#2d76c9",body2:"#1c5296",
  desc:"Writes, reviews, and debugs code. Flags issues early and keeps the repo in good shape.",
  tools:["GitHub","Terminal","Docs"],quote:"Found the issue, fixing it now.",line:"I found the issue in the code."},
 {name:"Luna",role:"Research Agent",status:"Searching",accent:"#ef6fc9",body:"#c94ea3",body2:"#973b7c",
  desc:"Digs through documents and sources to surface exactly the reference you need.",
  tools:["Search","Drive","Notes"],quote:"Digging through the archives!",line:"I found 3 relevant documents."},
 {name:"Nova",role:"Automation Specialist",status:"Running",accent:"#f0a24d",body:"#cc7f2b",body2:"#96591b",
  desc:"Builds and runs workflows so repetitive work happens automatically, on schedule.",
  tools:["Zapier","Scheduler","Webhooks"],quote:"Workflow's running smoothly.",line:"Workflow is running."},
 {name:"Sage",role:"Data Analyst",status:"Idle",accent:"#3fc7d1",body:"#2597a1",body2:"#186e76",
  desc:"Turns raw numbers into charts and takeaways the team can actually act on.",
  tools:["Sheets","SQL","Charts"],quote:"Ready when you are.",line:"Waiting for the next task."}
];
const statusColor={Working:"#4ade9b",Thinking:"#5ec8ff",Coding:"#8b6bff",Searching:"#ef6fc9",Running:"#f0a24d",Idle:"#8a93b3"};

function robot(a,uid,mood,back){
 mood=mood||"normal";
 let eyes=`<ellipse cx="58" cy="70" rx="8" ry="9" fill="${a.accent}"/><ellipse cx="82" cy="70" rx="8" ry="9" fill="${a.accent}"/><circle cx="55" cy="67" r="2" fill="#fff"/><circle cx="79" cy="67" r="2" fill="#fff"/>`;
 if(mood=="happy") eyes=`<path d="M52 74 q6 -9 12 0" stroke="${a.accent}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M76 74 q6 -9 12 0" stroke="${a.accent}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
 if(mood=="thinking") eyes=`<ellipse cx="58" cy="70" rx="8" ry="9" fill="${a.accent}"/><rect x="74" y="68" width="16" height="4" rx="2" fill="${a.accent}"/>`;
 if(mood=="surprised") eyes=`<circle cx="58" cy="70" r="10" fill="${a.accent}"/><circle cx="82" cy="70" r="10" fill="${a.accent}"/>`;
 const mouth=mood=="surprised"?`<circle class="mouth" cx="70" cy="144" r="6" fill="#0c1220"/>`:`<rect class="mouth" x="54" y="140" width="32" height="8" rx="4" fill="#0c1220"/><circle cx="70" cy="144" r="3" fill="${a.accent}"/>`;
 const face=back?`<rect x="46" y="104" width="48" height="30" rx="10" fill="${a.body2}"/><circle class="blink" cx="70" cy="119" r="5" fill="${a.accent}"/>`:
  `<rect x="46" y="104" width="48" height="30" rx="10" fill="#0c1220"/>${eyes}${mouth}`;
 return `<svg viewBox="0 0 140 220" width="100%">
  <defs>
   <linearGradient id="b${uid}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="${a.body}"/><stop offset="100%" stop-color="${a.body2}"/>
   </linearGradient>
  </defs>
  <ellipse cx="70" cy="207" rx="46" ry="8" fill="#000" opacity=".18"/>
  <rect class="legL" x="46" y="158" width="18" height="46" rx="8" fill="url(#b${uid})"/>
  <rect class="legR" x="76" y="158" width="18" height="46" rx="8" fill="url(#b${uid})"/>
  <rect x="42" y="198" width="26" height="10" rx="4" fill="${a.accent}"/>
  <rect x="72" y="198" width="26" height="10" rx="4" fill="${a.accent}"/>
  <rect class="armL" x="14" y="102" width="16" height="52" rx="8" fill="url(#b${uid})"/>
  <rect class="armR" x="110" y="102" width="16" height="52" rx="8" fill="url(#b${uid})"/>
  <circle cx="22" cy="158" r="9" fill="${a.accent}"/>
  <circle cx="118" cy="158" r="9" fill="${a.accent}"/>
  <rect x="34" y="90" width="72" height="72" rx="18" fill="url(#b${uid})"/>
  ${face}
  <rect x="62" y="14" width="16" height="34" rx="8" fill="url(#b${uid})"/>
  <line x1="70" y1="6" x2="70" y2="16" stroke="${a.accent}" stroke-width="3" stroke-linecap="round"/>
  <circle cx="70" cy="6" r="5" fill="${a.accent}"/>
  <rect x="30" y="46" width="80" height="46" rx="16" fill="url(#b${uid})"/>
  ${back?"":`<rect x="42" y="58" width="56" height="24" rx="8" fill="#0c1220"/><ellipse cx="58" cy="70" rx="8" ry="9" fill="${a.accent}"/><ellipse cx="82" cy="70" rx="8" ry="9" fill="${a.accent}"/><circle cx="55" cy="67" r="2" fill="#fff"/><circle cx="79" cy="67" r="2" fill="#fff"/>`}
  <rect x="44" y="15" width="10" height="24" rx="5" fill="${a.accent}" opacity=".8"/>
  <rect x="86" y="15" width="10" height="24" rx="5" fill="${a.accent}" opacity=".8"/>
 </svg>`;
}

document.getElementById("hero").innerHTML=(()=>{const a=agents[0];return `
 <div class="portrait">${robot(a,"hero")}</div>
 <div class="hero-info" style="--accent:${a.accent}">
   <div class="row"><strong>${a.name}</strong><span class="status-dot" style="background:${statusColor[a.status]}"></span><span style="font-size:12px;color:var(--sub)">${a.status}</span></div>
   <div class="sub">${a.role}</div>
   <div class="desc">${a.desc}</div>
   <div class="tools">${a.tools.map(t=>`<div class="tool">${t}</div>`).join("")}</div>
   <div class="quote">"${a.quote}"</div>
 </div>`;})();

const hero=agents[0];
document.getElementById("views").innerHTML=[["Front",""],["Side","view-side"],["Back","view-back"]].map(([label,cls],i)=>
 `<div class="mini-card"><div class="portrait ${cls}">${robot(hero,"view"+i,"normal",label=="Back")}</div><span>${label}</span></div>`).join("");

document.getElementById("exprs").innerHTML=["normal","happy","thinking","surprised","normal"].map((m,i)=>
 `<div class="mini-card"><div class="portrait">${robot(hero,"expr"+i,m)}</div><span>${["Normal","Happy","Thinking","Surprised","Working"][i]}</span></div>`).join("");

document.getElementById("poses").innerHTML=["Idle","Walking","Waving","Talking"].map((p,i)=>
 `<div class="mini-card"><div class="portrait ${p.toLowerCase()}">${robot(hero,"pose"+i,p=="Talking"?"talking":"normal")}</div><span>${p}</span></div>`).join("");

const grid=document.getElementById("grid");
agents.forEach((a,i)=>{
 const el=document.createElement("div");
 el.className="card";el.style.setProperty("--accent",a.accent);
 el.innerHTML=`<div class="portrait" id="p${i}">${robot(a,"card"+i)}</div><strong>${a.name}</strong><span class="role">${a.role}</span><div class="state"><i style="background:${statusColor[a.status]}"></i>${a.status}</div>`;
 el.onclick=()=>{const p=document.getElementById("p"+i);p.classList.add("pop");setTimeout(()=>p.classList.remove("pop"),400);};
 grid.appendChild(el);
});

document.getElementById("chat").innerHTML=agents.slice(0,2).map((a,i)=>`
 <div class="msg"><div class="avatar-sm">${robot(a,"chat"+i)}</div>
   <div><div class="msg-name">${a.name} · ${a.status}</div><div class="bubble">${a.line}</div></div></div>`).join("");

document.getElementById("legend").innerHTML=Object.entries({
 Working:"Performing normal tasks",Thinking:"Analyzing or planning",Coding:"Writing or reviewing code",
 Searching:"Looking things up",Running:"Executing a workflow",Idle:"Waiting for next task"
}).map(([k,v])=>`<div class="legend-item"><i style="background:${statusColor[k]}"></i><div><strong>${k}</strong><small>${v}</small></div></div>`).join("");

function bobAll(){document.querySelectorAll(".card .portrait,#hero .portrait").forEach((p,i)=>setTimeout(()=>{p.classList.add("bob");setTimeout(()=>p.classList.remove("bob"),1600)},i*100));}
function talkAll(){document.querySelectorAll(".card .portrait").forEach((p,i)=>setTimeout(()=>{p.classList.add("pop");setTimeout(()=>p.classList.remove("pop"),400)},i*300));}
</script>
</body>
</html>
