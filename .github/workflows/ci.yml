# The tasks service's tests, on every pull request.
#
# Three jobs, matching the tiers in CLAUDE.md:
#   unit           the unit suite with the database tier skipped
#                  (AIUI_SKIP_DB=1, tests/conftest.py). Required.
#   browser        the Playwright suites against the page files. Required.
#   database-tier  the unit suite against a throwaway Postgres, which is the
#                  only place the db_session tests can run outside the
#                  server. Advisory (continue-on-error) until it has been
#                  seen green there.
#
# Until 2026-10-16 nothing ran any of the ~450 browser tests before a merge.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
          # Files that open the database without the shared fixture (they
          # run in the database-tier job) and four that read the server's
          # own templates or a route table only the deployed app registers.
          # Measured 2026-10-16: with these out, 4860 pass and 0 fail here.
          NO_DB_IGNORES: >-
            --ignore=tests/browser
            --ignore=tests/test_agent_job_store.py
            --ignore=tests/test_gateway_bot_routes_db.py
            --ignore=tests/test_code_proposals.py
            --ignore=tests/test_routes_code.py
            --ignore=tests/test_agent_memory_db.py
            --ignore=tests/test_functional_templates_alive.py
            --ignore=tests/test_template_apps_animations.py
            --ignore=tests/test_routes_agent_jobs.py
            --ignore=tests/test_routes_fusion_page.py
            --ignore=tests/test_agent_decider_db.py

defaults:
  run:
    working-directory: mcp-servers/tasks

jobs:
  unit:
    name: unit (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-servers/tasks/requirements.txt
      - run: pip install -r requirements.txt
      # tests/test_picker_js.py drives a browser from the unit tier; the
      # first run of this job erred on twelve of them for want of one.
      # `--with-deps` runs apt against Ubuntu's mirrors, and that is the
      # most fragile thing in this pipeline. On 2026-11-11
      # security.ubuntu.com was unresolvable from the runner for twenty
      # minutes, two runs in a row, and every deploy behind it was blocked,
      # other people's included. Every package it could not fetch was a
      # FONT: fonts-wqy-zenhei, xfonts-encodings, xfonts-utils and friends.
      #
      # So try the full install and fall back to the browser alone. The
      # browser comes from Playwright's own CDN, a different host that was
      # answering throughout, and the runner image already carries most of
      # Chromium's shared libraries. A missing CJK font changes nothing any
      # assertion in this repository reads; a blocked deploy changes
      # everything.
      #
      # Still fails honestly when there is genuinely no browser, because
      # the fallback has to succeed on its own.
      # The browser is CACHED, keyed on the playwright version pip
      # actually resolved. requirements.txt says `playwright>=1.40.0`, so
      # the version and its browser build id both move, and a key built
      # from the requirements file would serve a stale browser.
      #
      # On a hit the install step is skipped entirely, apt included. That
      # is the point: the fragile part was never the browser download from
      # Playwright's CDN, it was `--with-deps` running apt against
      # Ubuntu's mirrors, which on 2026-11-11 was unresolvable for twenty
      # minutes and blocked every deploy behind it, other people's as
      # well. The fallback below already accepted a browser-only install
      # as sufficient, which is how that day was survived, so skipping apt
      # on a hit is the behaviour that already shipped and worked.
      # importlib.metadata, NOT playwright.__version__, which does not
      # exist: the package has no such attribute. The first version of
      # this step read it anyway, `python -c` failed, the `$( )` was
      # empty, `echo` succeeded, and the step went green with a cache key
      # of "ms-playwright-Linux-" and no version in it. Measured in the
      # run logs of 2026-11-13: three runs, three "Cache not found for
      # input keys: ms-playwright-Linux-".
      #
      # So the value is checked before it is written. An empty one fails
      # the step rather than keying every playwright version to one
      # cache, which is the silent staleness this key exists to avoid.
      - name: playwright version for the cache key
        id: pw
        run: |
          v=$(python -c 'from importlib.metadata import version; print(version("playwright"))')
          test -n "$v"
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: cache the browser
        id: browser_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: chromium for the browser tests
        if: steps.browser_cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install --with-deps chromium ||
            python -m playwright install chromium
      - name: pytest
        env:
          AIUI_SKIP_DB: "1"
        run: python -m pytest tests/ -q -p no:cacheprovider $NO_DB_IGNORES

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-servers/tasks/requirements.txt
      - run: pip install -r requirements.txt
      # `--with-deps` runs apt against Ubuntu's mirrors, and that is the
      # most fragile thing in this pipeline. On 2026-11-11
      # security.ubuntu.com was unresolvable from the runner for twenty
      # minutes, two runs in a row, and every deploy behind it was blocked,
      # other people's included. Every package it could not fetch was a
      # FONT: fonts-wqy-zenhei, xfonts-encodings, xfonts-utils and friends.
      #
      # So try the full install and fall back to the browser alone. The
      # browser comes from Playwright's own CDN, a different host that was
      # answering throughout, and the runner image already carries most of
      # Chromium's shared libraries. A missing CJK font changes nothing any
      # assertion in this repository reads; a blocked deploy changes
      # everything.
      #
      # Still fails honestly when there is genuinely no browser, because
      # the fallback has to succeed on its own.
      # The browser is CACHED, keyed on the playwright version pip
      # actually resolved. requirements.txt says `playwright>=1.40.0`, so
      # the version and its browser build id both move, and a key built
      # from the requirements file would serve a stale browser.
      #
      # On a hit the install step is skipped entirely, apt included. That
      # is the point: the fragile part was never the browser download from
      # Playwright's CDN, it was `--with-deps` running apt against
      # Ubuntu's mirrors, which on 2026-11-11 was unresolvable for twenty
      # minutes and blocked every deploy behind it, other people's as
      # well. The fallback below already accepted a browser-only install
      # as sufficient, which is how that day was survived, so skipping apt
      # on a hit is the behaviour that already shipped and worked.
      # importlib.metadata, NOT playwright.__version__, which does not
      # exist: the package has no such attribute. The first version of
      # this step read it anyway, `python -c` failed, the `$( )` was
      # empty, `echo` succeeded, and the step went green with a cache key
      # of "ms-playwright-Linux-" and no version in it. Measured in the
      # run logs of 2026-11-13: three runs, three "Cache not found for
      # input keys: ms-playwright-Linux-".
      #
      # So the value is checked before it is written. An empty one fails
      # the step rather than keying every playwright version to one
      # cache, which is the silent staleness this key exists to avoid.
      - name: playwright version for the cache key
        id: pw
        run: |
          v=$(python -c 'from importlib.metadata import version; print(version("playwright"))')
          test -n "$v"
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: cache the browser
        id: browser_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: chromium for the browser tests
        if: steps.browser_cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install --with-deps chromium ||
            python -m playwright install chromium
      - name: pytest
        env:
          AIUI_SKIP_DB: "1"
        # test_agent_panel_live drives a running service and is for the box.
        run: python -m pytest tests/browser -q -p no:cacheprovider --ignore=tests/browser/test_agent_panel_live.py

  database-tier:
    name: database tier (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aiui_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-servers/tasks/requirements.txt
      - run: pip install -r requirements.txt
      - name: pytest, with the database
        env:
          # Both guards tests/conftest.py insists on before it will TRUNCATE:
          # the flag, and a database whose name contains "test".
          AIUI_TEST_DB: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aiui_test
        run: python -m pytest tests/ -q -p no:cacheprovider --ignore=tests/browser
