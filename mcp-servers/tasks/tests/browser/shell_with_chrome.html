<!doctype html><html><head><meta charset="utf-8"><title>shell with chrome</title>
<style>
  /* The real Open WebUI sidebar is a tall narrow fixed column, and that shape
     is load-bearing: aiuiSidebarRightEdge() walks up from a nav entry looking
     for left<=8, width 120-520, height>200 to decide where the pane starts. */
  body { margin: 0; }
  #sidebar {
    position: fixed; left: 0; top: 0; width: 260px; height: 100vh;
    box-sizing: border-box; padding: 8px;
  }
  /* The sticky top row, copied from Open WebUI v0.11.0 Sidebar.svelte. The
     shape matters and an earlier version of this file got it wrong: the
     collapse control was a lone button parked in the opposite corner of the
     page, so the test proved only that isolated buttons are safe. In the real
     sidebar the button is 30px and sits immediately beside an `a[href="/"]`
     carrying `flex flex-1`, which eats the rest of the row. A dismissal rule
     that keys on links has to be tested against THAT, because the link is
     inches from the button and going to "/" is the dashboard. */
  #top-row { display: flex; align-items: center; gap: 4px; }
  #sidebar-toggle {
    width: 30px; height: 30px;
    display: flex; justify-content: center; align-items: center;
  }
  #home-link { display: flex; flex: 1 1 0%; padding: 0 2px; }
</style>
</head>
<body>
  <!-- A NON-ADMIN sidebar: no /workspace link, which is what regular users get. -->
  <nav id="sidebar">
    <div id="top-row">
      <!-- aria-label and the nested div are both real. The click usually lands
           on the inner element, not the button, so closest() has to walk. -->
      <button id="sidebar-toggle" aria-label="Close Sidebar">
        <div class="self-center"><span id="toggle-glyph">|||</span></div>
      </button>
      <a id="home-link" href="/"><div id="sidebar-webui-name">Open WebUI</div></a>
    </div>
    <div class="row"><a href="/notes" draggable="false"><span>Notes</span></a></div>
    <div class="row"><a href="/calendar" draggable="false"><span>Calendar</span></a></div>
  </nav>
  <script src="./task-panel.js"></script>
</body></html>
