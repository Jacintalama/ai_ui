<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="What each of your cron jobs answered, read and unread, like an inbox.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cron Outputs</title>
  <link rel="alternate icon" href="/static/favicon.png" crossorigin="use-credentials">
  <style>
/* Hallmark · v2.0.0 · build · scope: app · genre: modern-minimal
   theme: cron.html's own dark system; layout: a two-pane inbox, list and reader. */
    :root[data-theme="dark"] {
      --bg:          #0a0a0b;
      --surface:     #111113;
      --surface-2:   #17171a;
      --surface-3:   #1e1e22;
      --border:      #24242a;
      --border-2:    #3d3d47;
      --text:        #ededee;
      --text-2:      #c9c9d2;
      --muted:       #90909b;
      --accent:      #7c8cff;
      --accent-2:    #5d6cff;
      --accent-soft: #1e2140;
      --on-accent:   #0a0a0b;
      --success:     #22c55e;
      --success-soft:#0d2a1a;
      --danger:      #f87171;
      --danger-soft: #2a1414;
      --unread:      #ef4444;
      --color-focus: #b9c4ff;
      --code-bg:     #1a1a1f;
      --radius-sm: 4px;
      --radius:    8px;
      --radius-lg: 12px;
      --font-ui: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
      --font-mono: "SFMono-Regular", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { height: 100%; overflow-x: clip; }
    :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px;
                     border-radius: var(--radius-sm); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important; }
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-ui);
           font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button, select { font: inherit; color: inherit; }
    button { cursor: pointer; }

    .page { display: flex; flex-direction: column; height: 100vh;
            max-width: 1280px; margin: 0 auto; padding: 20px 20px 16px; gap: 12px; }

    /* Header: what this is, and the three things you do to all of it. */
    .head { display: flex; flex-wrap: wrap; align-items: center;
            justify-content: space-between; gap: 12px; }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
    .sub { color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { border: 1px solid var(--border-2); background: var(--surface-2);
           border-radius: var(--radius); padding: 8px 12px; line-height: 1.2;
           transition: background-color 120ms ease, border-color 120ms ease; }
    .btn:hover { background: var(--surface-3); border-color: var(--muted); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { cursor: not-allowed; opacity: 0.5; transform: none; }
    .btn-primary { background: var(--accent); border-color: var(--accent);
                   color: var(--on-accent); font-weight: 600; }
    .btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }

    /* Toolbar: All / Unread, and which cron. */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 4px; gap: 4px; }
    .tab { border: 0; background: transparent; border-radius: var(--radius-sm);
           padding: 4px 12px; color: var(--muted);
           transition: background-color 120ms ease, color 120ms ease; }
    .tab:hover { color: var(--text); }
    .tab:active { transform: translateY(1px); }
    .tab[aria-selected="true"] { background: var(--surface-3); color: var(--text); font-weight: 600; }
    .tab .n { margin-left: 4px; color: var(--muted); font-weight: 500; }
    .tab[data-tab="unread"] .n.has { color: var(--unread); font-weight: 700; }
    select { background: var(--surface); border: 1px solid var(--border);
             border-radius: var(--radius); padding: 8px 12px; max-width: 280px; }
    .note { color: var(--muted); font-size: 12px; margin-left: auto; }

    /* The inbox: list on the left, reader on the right, each scrolls alone. */
    .inbox { flex: 1; min-height: 0; display: grid;
             grid-template-columns: minmax(280px, 380px) 1fr; gap: 12px; }
    .pane { background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); min-height: 0; overflow: auto; }
    .list { list-style: none; }
    .list li + li { border-top: 1px solid var(--border); }
    .row { display: grid; grid-template-columns: 12px 1fr auto; column-gap: 8px;
           row-gap: 4px; width: 100%; text-align: left; border: 0;
           background: transparent; padding: 12px 16px 12px 12px;
           transition: background-color 120ms ease; }
    .row:hover { background: var(--surface-2); }
    .row:active { background: var(--surface-3); }
    .row[aria-current="true"] { background: var(--accent-soft); }
    .dot { grid-row: 1; align-self: center; width: 8px; height: 8px; border-radius: 50%; }
    .row.unread .dot { background: var(--unread); }
    .row-name { grid-column: 2; font-weight: 500; color: var(--text-2);
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row.unread .row-name { font-weight: 700; color: var(--text); }
    .row-time { grid-column: 3; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .row.unread .row-time { color: var(--text); font-weight: 600; }
    .row-snip { grid-column: 2 / 4; color: var(--muted); font-size: 13px;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                overflow: hidden; }
    .row-tag { grid-column: 2 / 4; justify-self: start; }

    .pill { border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 600;
            line-height: 20px; display: inline-block; }
    .pill-ok { background: var(--success-soft); color: var(--success); }
    .pill-bad { background: var(--danger-soft); color: var(--danger); }

    .reader { padding: 20px 24px 28px; }
    .reader-top { display: flex; align-items: flex-start; justify-content: space-between;
                  gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border);
                  padding-bottom: 12px; margin-bottom: 16px; }
    .reader h2 { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; text-wrap: balance; }
    .reader-meta { display: flex; align-items: center; gap: 8px; color: var(--muted);
                   font-size: 13px; margin-top: 4px; }
    .back { display: none; margin-bottom: 12px; }
    .placeholder { height: 100%; display: grid; place-items: center; text-align: center;
                   color: var(--muted); padding: 28px; }
    .placeholder strong { display: block; color: var(--text); font-size: 15px;
                          margin-bottom: 4px; }

    /* The answer, as markdown made safe: text is escaped before any tag. */
    .md { color: var(--text-2); max-width: 72ch; overflow-wrap: anywhere; }
    .md > * + * { margin-top: 12px; }
    .md h3, .md h4, .md h5, .md h6 { color: var(--text); font-size: 15px; font-weight: 600; }
    .md strong { color: var(--text); }
    .md ul, .md ol { padding-left: 20px; }
    .md li + li { margin-top: 4px; }
    .md code { font-family: var(--font-mono); font-size: 12.5px; background: var(--code-bg);
               border-radius: var(--radius-sm); padding: 0 4px; }
    .md pre { background: var(--code-bg); border-radius: var(--radius); padding: 12px;
              overflow: auto; }
    .md pre code { padding: 0; background: transparent; }
    .md a { color: var(--accent); }
    .md .empty { color: var(--muted); font-style: italic; }

    .state { padding: 28px 20px; text-align: center; color: var(--muted); }
    .state strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
    .state .btn { margin-top: 12px; }

    /* Phones and narrow panes: one column, list OR reader, with a way back. */
    @media (max-width: 800px) {
      .page { padding: 16px; height: auto; min-height: 100vh; }
      .inbox { grid-template-columns: 1fr; }
      .pane { overflow: visible; }
      .inbox .reader-pane { display: none; }
      .inbox.reading .list-pane { display: none; }
      .inbox.reading .reader-pane { display: block; }
      .back { display: inline-block; }
      .note { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="head">
      <div>
        <h1>Cron outputs</h1>
        <p class="sub">Every answer your cron jobs gave, newest first. Open one to read it.</p>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="mark-all" disabled>Mark all read</button>
        <button type="button" class="btn" id="refresh">Refresh</button>
        <button type="button" class="btn btn-primary" id="to-cron">Cron Jobs</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="Which outputs">
        <button type="button" class="tab" role="tab" data-tab="all" aria-selected="true">All<span class="n" id="n-all">0</span></button>
        <button type="button" class="tab" role="tab" data-tab="unread" aria-selected="false">Unread<span class="n" id="n-unread">0</span></button>
      </div>
      <select id="filter" aria-label="Show outputs from">
        <option value="">All cron jobs</option>
      </select>
      <span class="note" id="note" role="status" aria-live="polite"></span>
    </div>

    <div class="inbox" id="inbox">
      <section class="pane list-pane" aria-label="Outputs">
        <div id="list-region"><div class="state">Loading your outputs…</div></div>
      </section>
      <section class="pane reader-pane" aria-label="Reader">
        <div id="reader" class="reader-wrap">
          <div class="placeholder"><div><strong>Pick an output to read it</strong>Unread ones have a red dot.</div></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      "use strict";
      var API = "/api/tasks/schedules/outputs";
      var WANT_KEY = "aiuiCronOutputWant";
      var inbox = document.getElementById("inbox");
      var listRegion = document.getElementById("list-region");
      var reader = document.getElementById("reader");
      var filter = document.getElementById("filter");
      var note = document.getElementById("note");
      var markAllBtn = document.getElementById("mark-all");
      var all = [];
      var tab = "all";
      var selectedId = "";

      function authHeaders(json) {
        var h = { Accept: "application/json" };
        if (json) h["Content-Type"] = "application/json";
        try {
          var token = localStorage.getItem("token");
          if (token) h.Authorization = "Bearer " + token;
        } catch (e) { /* storage blocked: the cookie still carries the session */ }
        return h;
      }

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      // ---- markdown, made safe ------------------------------------------
      // Everything is escaped FIRST; the only tags that can appear are the
      // ones written below, and a link only for http(s). A cron answer is
      // model output and must never become markup of its own.
      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function inline(t) {
        return t.split(/(`[^`]+`)/g).map(function (part) {
          if (/^`[^`]+`$/.test(part)) return "<code>" + part.slice(1, -1) + "</code>";
          return part
            .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
                     '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
        }).join("");
      }
      function md(src) {
        var lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
        var html = "", para = [], list = null, inCode = false, code = [];
        function flushPara() {
          if (!para.length) return;
          html += "<p>" + para.map(function (l) { return inline(esc(l)); }).join("<br>") + "</p>";
          para = [];
        }
        function flushList() {
          if (!list) return;
          html += "<" + list.tag + ">" + list.items.map(function (i) {
            return "<li>" + inline(esc(i)) + "</li>";
          }).join("") + "</" + list.tag + ">";
          list = null;
        }
        lines.forEach(function (line) {
          if (/^\s*```/.test(line)) {
            if (inCode) { html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>"; code = []; inCode = false; }
            else { flushPara(); flushList(); inCode = true; }
            return;
          }
          if (inCode) { code.push(line); return; }
          if (!line.trim()) { flushPara(); flushList(); return; }
          var h = line.match(/^(#{1,4})\s+(.*)$/);
          var ul = line.match(/^\s*[-*•]\s+(.*)$/);
          var ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
          if (h) {
            flushPara(); flushList();
            var lv = Math.min(6, h[1].length + 2);
            html += "<h" + lv + ">" + inline(esc(h[2])) + "</h" + lv + ">";
            return;
          }
          if (ul || ol) {
            flushPara();
            var tag = ul ? "ul" : "ol";
            if (!list || list.tag !== tag) { flushList(); list = { tag: tag, items: [] }; }
            list.items.push((ul || ol)[1]);
            return;
          }
          flushList();
          para.push(line);
        });
        if (inCode) html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>";
        flushPara(); flushList();
        return html;
      }
      function plain(src) {
        return String(src || "")
          .replace(/```[\s\S]*?```/g, " ")
          .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
          .replace(/[*_`#>]+/g, "")
          .replace(/\s+/g, " ").trim();
      }

      // ---- time -----------------------------------------------------------
      function dateOf(iso) {
        var d = iso ? new Date(iso) : null;
        return d && !isNaN(d.getTime()) ? d : null;
      }
      function shortWhen(iso) {
        var d = dateOf(iso);
        if (!d) return "";
        var now = new Date();
        if (d.toDateString() === now.toDateString()) {
          return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
        }
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      }
      function longWhen(iso) {
        var d = dateOf(iso);
        return d ? d.toLocaleString(undefined, { weekday: "short", day: "numeric",
          month: "short", year: "numeric", hour: "numeric", minute: "2-digit" }) : "";
      }

      // ---- telling the shell ---------------------------------------------
      // The red count on Cron Jobs is the server's unread count; the shell
      // re-reads it at once instead of on its next 30 second check.
      function tellShell() {
        try {
          if (window.parent !== window) {
            window.parent.postMessage({ type: "aiui:cron-outputs-changed" }, location.origin);
          }
        } catch (e) { /* the next check catches up */ }
      }
      function say(text) {
        note.textContent = text || "";
      }

      // ---- read / unread ---------------------------------------------------
      function setRead(o, read) {
        if (!o || o.unread === !read) return;
        o.unread = !read;
        drawList();
        if (selectedId === o.id) drawReader();
        fetch(API + "/" + encodeURIComponent(o.id) + "/read", {
          method: "POST", credentials: "include", headers: authHeaders(true),
          body: JSON.stringify({ read: read }),
        }).then(function (r) {
          if (!r.ok) throw new Error(String(r.status));
          tellShell();
        }).catch(function () {
          o.unread = read;
          drawList();
          if (selectedId === o.id) drawReader();
          say("Could not save that. Try again.");
        });
      }

      function markAllRead() {
        var scope = filter.value;
        var hit = all.filter(function (o) {
          return o.unread && (!scope || o.schedule_id === scope);
        });
        if (!hit.length) return;
        hit.forEach(function (o) { o.unread = false; });
        drawList();
        drawReader();
        fetch(API + "/read-all", {
          method: "POST", credentials: "include", headers: authHeaders(true),
          body: JSON.stringify(scope ? { schedule_id: scope } : {}),
        }).then(function (r) {
          if (!r.ok) throw new Error(String(r.status));
          say(hit.length === 1 ? "1 marked read." : hit.length + " marked read.");
          tellShell();
        }).catch(function () {
          hit.forEach(function (o) { o.unread = true; });
          drawList();
          drawReader();
          say("Could not mark them read. Try again.");
        });
      }

      // ---- drawing ----------------------------------------------------------
      function visible() {
        return all.filter(function (o) {
          if (filter.value && o.schedule_id !== filter.value) return false;
          // An output read while on Unread stays until you move on, like mail.
          if (tab === "unread" && !o.unread && o.id !== selectedId) return false;
          return true;
        });
      }

      function counts() {
        var inScope = all.filter(function (o) { return !filter.value || o.schedule_id === filter.value; });
        var unread = inScope.filter(function (o) { return o.unread; }).length;
        document.getElementById("n-all").textContent = String(inScope.length);
        var nu = document.getElementById("n-unread");
        nu.textContent = String(unread);
        nu.classList.toggle("has", unread > 0);
        markAllBtn.disabled = unread === 0;
      }

      function rowFor(o) {
        var li = el("li");
        var b = el("button", "row" + (o.unread ? " unread" : ""));
        b.type = "button";
        b.setAttribute("data-id", o.id);
        b.setAttribute("aria-current", o.id === selectedId ? "true" : "false");
        b.setAttribute("aria-label", (o.unread ? "Unread. " : "") + (o.name || "Untitled")
          + ", " + longWhen(o.at));
        b.appendChild(el("span", "dot"));
        b.appendChild(el("span", "row-name", o.name || "Untitled"));
        b.appendChild(el("span", "row-time", shortWhen(o.at)));
        var snip = plain(o.result);
        b.appendChild(el("span", "row-snip", snip ? snip.slice(0, 160) : "No answer."));
        if (!o.ok) {
          var tag = el("span", "row-tag");
          tag.appendChild(el("span", "pill pill-bad", "Failed"));
          b.appendChild(tag);
        }
        b.addEventListener("click", function () { open(o.id); });
        li.appendChild(b);
        return li;
      }

      function drawList() {
        counts();
        var rows = visible();
        listRegion.textContent = "";
        if (!all.length) {
          var empty = el("div", "state");
          empty.appendChild(el("strong", null, "No outputs yet"));
          empty.appendChild(el("span", null, "When one of your cron jobs runs, its answer lands here."));
          listRegion.appendChild(empty);
          return;
        }
        if (!rows.length) {
          var none = el("div", "state");
          none.appendChild(el("strong", null, tab === "unread" ? "All caught up" : "Nothing here"));
          none.appendChild(el("span", null, tab === "unread"
            ? "Every output here has been read." : "This cron job has no outputs yet."));
          listRegion.appendChild(none);
          return;
        }
        var ul = el("ul", "list");
        rows.forEach(function (o) { ul.appendChild(rowFor(o)); });
        listRegion.appendChild(ul);
      }

      function drawReader() {
        var o = all.find(function (x) { return x.id === selectedId; });
        reader.textContent = "";
        if (!o) {
          var ph = el("div", "placeholder");
          var inner = el("div");
          inner.appendChild(el("strong", null, "Pick an output to read it"));
          inner.appendChild(document.createTextNode("Unread ones have a red dot."));
          ph.appendChild(inner);
          reader.appendChild(ph);
          return;
        }
        var wrap = el("article", "reader");
        wrap.setAttribute("data-reader", "");
        var back = el("button", "btn back", "← All outputs");
        back.type = "button";
        back.addEventListener("click", function () {
          inbox.classList.remove("reading");
          var row = listRegion.querySelector('[data-id="' + CSS.escape(o.id) + '"]');
          if (row) row.focus();
        });
        wrap.appendChild(back);
        var top = el("div", "reader-top");
        var left = el("div");
        left.appendChild(el("h2", null, o.name || "Untitled"));
        var meta = el("div", "reader-meta");
        meta.appendChild(el("span", "pill " + (o.ok ? "pill-ok" : "pill-bad"), o.ok ? "Completed" : "Failed"));
        var t = el("time", null, longWhen(o.at));
        if (o.at) t.setAttribute("datetime", o.at);
        meta.appendChild(t);
        left.appendChild(meta);
        top.appendChild(left);
        var toggle = el("button", "btn", o.unread ? "Mark as read" : "Mark as unread");
        toggle.type = "button";
        toggle.setAttribute("data-toggle-read", "");
        toggle.addEventListener("click", function () { setRead(o, o.unread); });
        top.appendChild(toggle);
        wrap.appendChild(top);
        var body = el("div", "md");
        var text = String(o.result || "").trim();
        if (text) body.innerHTML = md(text);
        else body.appendChild(el("p", "empty", "This run left no answer."));
        wrap.appendChild(body);
        reader.appendChild(wrap);
      }

      function open(id) {
        var o = all.find(function (x) { return x.id === id; });
        if (!o) return;
        selectedId = id;
        inbox.classList.add("reading");
        drawList();
        drawReader();
        // Opening it is reading it, like an email.
        if (o.unread) setRead(o, true);
        var pane = document.querySelector(".reader-pane");
        if (pane) pane.scrollTop = 0;
      }

      function fillFilter() {
        var keep = filter.value;
        var names = {};
        all.forEach(function (o) { names[o.schedule_id] = o.name || "Untitled"; });
        while (filter.options.length > 1) filter.remove(1);
        Object.keys(names).sort(function (a, b) {
          return names[a].localeCompare(names[b]);
        }).forEach(function (id) {
          var opt = el("option", null, names[id]);
          opt.value = id;
          filter.appendChild(opt);
        });
        filter.value = names[keep] ? keep : "";
      }

      function setTab(name) {
        tab = name;
        document.querySelectorAll(".tab").forEach(function (t) {
          t.setAttribute("aria-selected", t.getAttribute("data-tab") === name ? "true" : "false");
        });
      }

      // From the Cron Jobs page: "View output" on one cron's card opens this
      // page on that cron's newest answer. Handed over through localStorage,
      // which both pages share, and only honoured while it is fresh.
      function takeWanted() {
        var want = null;
        try {
          want = JSON.parse(localStorage.getItem(WANT_KEY) || "null");
          localStorage.removeItem(WANT_KEY);
        } catch (e) { want = null; }
        if (!want || !want.schedule_id || Date.now() - (want.at || 0) > 120000) return;
        var newest = all.find(function (o) { return o.schedule_id === want.schedule_id; });
        if (!newest) return;
        filter.value = want.schedule_id;
        setTab("all");
        open(newest.id);
      }

      function load() {
        say("");
        fetch(API + "?limit=50", { credentials: "include", headers: authHeaders(false) })
          .then(function (r) {
            var ct = (r.headers.get("content-type") || "");
            if (!r.ok || ct.indexOf("json") === -1) throw new Error(String(r.status));
            return r.json();
          })
          .then(function (rows) {
            all = Array.isArray(rows) ? rows : [];
            if (selectedId && !all.some(function (o) { return o.id === selectedId; })) selectedId = "";
            fillFilter();
            drawList();
            drawReader();
            takeWanted();
          })
          .catch(function () {
            listRegion.textContent = "";
            var box = el("div", "state");
            box.appendChild(el("strong", null, "Could not load your outputs"));
            box.appendChild(el("span", null, "The check did not go through."));
            var b = el("button", "btn", "Try again");
            b.type = "button";
            b.addEventListener("click", load);
            box.appendChild(b);
            listRegion.appendChild(box);
          });
      }

      document.querySelectorAll(".tab").forEach(function (t) {
        t.addEventListener("click", function () { setTab(t.getAttribute("data-tab")); drawList(); });
      });
      filter.addEventListener("change", function () { drawList(); });
      markAllBtn.addEventListener("click", markAllRead);
      document.getElementById("refresh").addEventListener("click", load);

      // Arrow keys move through the list, like a mail client.
      listRegion.addEventListener("keydown", function (e) {
        if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
        var rows = Array.prototype.slice.call(listRegion.querySelectorAll(".row"));
        var i = rows.indexOf(document.activeElement);
        if (i < 0) return;
        e.preventDefault();
        var next = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))];
        if (next) next.focus();
      });

      // Inside the shell, ask it to open the Cron Jobs pane, exactly as the
      // sidebar would. Standalone, go to the Cron Jobs page itself.
      document.getElementById("to-cron").addEventListener("click", function () {
        if (window.parent !== window) {
          window.parent.postMessage({ type: "aiui:open-pane", path: "/cronjobs" }, location.origin);
        } else {
          location.href = "/tasks/static/cron.html";
        }
      });

      // The pane keeps this page alive while hidden; read again on return.
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) load();
      });

      load();
    })();
  </script>
</body>
</html>
