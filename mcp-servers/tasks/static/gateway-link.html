<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channels</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; padding: 1.75rem 2rem 4rem;
    background: transparent; color: inherit;
  }
  header { margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .3rem; }
  .lede { opacity: .7; margin: 0; max-width: 46rem; }
  .count { font-size: .85rem; opacity: .6; margin-top: .4rem; }

  ul { list-style: none; padding: 0; margin: 0; }
  .row {
    border: 1px solid rgba(128,128,128,.25); border-radius: .55rem;
    margin-bottom: .6rem; padding: .85rem 1rem;
  }
  .row.dim { opacity: .62; }
  .head { display: flex; align-items: center; gap: .8rem; }
  .icon { font-size: 1.2rem; width: 1.6rem; text-align: center; flex: none; }
  .icon svg { display: block; margin: 0 auto; }
  .naming { flex: 1; min-width: 0; }
  .titleline { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .name { font-weight: 600; }
  .badge {
    font-size: .7rem; letter-spacing: .04em; text-transform: uppercase;
    border: 1px solid rgba(128,128,128,.4); border-radius: .25rem;
    padding: .1rem .45rem; opacity: .8; white-space: nowrap;
  }
  .badge.on { border-color: #1a7f43; color: #1a7f43; opacity: 1; }
  .blurb { font-size: .85rem; opacity: .7; margin-top: .2rem; }
  .why { font-size: .85rem; opacity: .7; margin-top: .2rem; }

  button {
    font: inherit; font-size: .875rem; padding: .35rem .8rem; cursor: pointer;
    border-radius: .35rem; border: 1px solid rgba(128,128,128,.45);
    background: transparent; color: inherit; white-space: nowrap;
  }
  button.primary { border-color: transparent; background: #2f6fe4; color: #fff; }
  button[disabled] { opacity: .5; cursor: default; }
  .botbox { margin-top: 14px; padding-top: 12px; border-top: 1px solid #1e2b36; }
  /* When a bot box (or the disconnect block, which borrows the same class)
     opens the expanded area, it already sits right under the panel's own
     divider. A second one immediately on top of it would read as a double
     line, so the first section inside a panel skips its own. */
  .panel > .botbox:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  .botheadline { font-weight: 600; letter-spacing: .04em; margin-bottom: 6px; }
  .fieldlabel { font-size: 11px; letter-spacing: .08em; margin-top: 10px; opacity: .8; }
  .botbox input { width: 100%; box-sizing: border-box; margin-top: 4px; }
  .botactions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .panel {
    margin-top: .85rem; padding-top: .85rem;
    border-top: 1px solid rgba(128,128,128,.22);
  }
  .step { font-size: .875rem; opacity: .8; margin: 0 0 .6rem; }
  .steps { margin: .2rem 0 .8rem; padding-left: 1.3rem; font-size: .875rem; }
  .steps li { margin-bottom: .5rem; }
  .cmd {
    display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
    margin: .35rem 0;
  }
  .cmd code {
    flex: 1; min-width: 0; overflow-x: auto; white-space: pre;
    background: #0d141b; border: 1px solid #1e2b36; border-radius: 4px;
    padding: .35rem .5rem; font-size: .8125rem;
  }
  .entry { display: flex; gap: .5rem; flex-wrap: wrap; }
  input {
    font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .16em; text-transform: uppercase;
    flex: 1; min-width: 12rem; padding: .45rem .7rem;
    border: 1px solid rgba(128,128,128,.45); border-radius: .35rem;
    background: transparent; color: inherit;
  }
  .warn {
    font-size: .82rem; opacity: .85; margin: .7rem 0 0;
    border-left: 3px solid #d08b1e; padding: .4rem .7rem;
  }
  .msg { font-size: .875rem; margin-top: .6rem; min-height: 1.2rem; }
  .ok { color: #1a7f43; }
  .bad { color: #c0392b; }
</style>
</head>
<body>
  <header>
    <h1>Channels</h1>
    <p class="lede">The places you can talk to IO from, besides this browser.
    Every channel you connect runs as your account alone, with your own memory,
    tools and models. Nobody else can see or use what you connect.</p>
    <p class="count" id="count"></p>
  </header>

  <ul id="list"><li class="row"><span class="blurb">Loading...</span></li></ul>

<script>
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
let openPanel = null;

// --- Brand marks -------------------------------------------------------
// One entry per platform, built as plain SVG shapes: no external image, no
// icon font, nothing fetched over the network. Adding a channel later is
// one entry here; a platform with no entry falls back to its catalogue
// emoji in buildIcon() below, so it never renders blank.
//
// Every shape is turned into a real element with document.createElementNS
// and plain attributes/textContent, never assembled as an HTML string. That
// rule holds everywhere on this page, including here, because this same
// page also has to print a bot's username and Telegram's own error text,
// both of which come from outside this server.
const SVG_NS = "http://www.w3.org/2000/svg";

const LOGOS = {
  // Telegram blue circle with a white paper-plane mark.
  telegram: { shapes: [
    { tag: "circle", attrs: { cx: 12, cy: 12, r: 12, fill: "#2AABEE" } },
    { tag: "path", attrs: { d: "M19 6 L5 12.6 L11.5 14.6 L15 18.3 Z", fill: "#fff" } },
    { tag: "path", attrs: { d: "M5 12.6 L11.5 14.6 L9.3 11.3 Z", fill: "#2AABEE" } },
    { tag: "path", attrs: { d: "M11.5 14.6 L15 18.3 L13.1 13.6 Z", fill: "#cfe8fb" } },
  ]},
  // No brand of its own: a plain prompt glyph in the page's own text color.
  cli: { shapes: [
    { tag: "path", attrs: { d: "M4 6 L10 12 L4 18", fill: "none",
      stroke: "currentColor", "stroke-width": "2",
      "stroke-linecap": "round", "stroke-linejoin": "round" } },
    { tag: "path", attrs: { d: "M12 18 L19 18", fill: "none",
      stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round" } },
  ]},
  // Slack's four-color pinwheel: one rounded arm, offset from center so it
  // reads as a swirl rather than a cross, repeated at four rotations.
  // Four rounded bars, each with a square cap at its OUTER end, rotated about
  // the centre. The caps are what make it a pinwheel, and the bars stopping
  // short of the middle are what leave Slack's square hole. An earlier version
  // put a circle at the INNER end instead, which read as four loose pills.
  slack: { shapes: [
    { tag: "g", attrs: { transform: "rotate(0 12 12)" }, children: [
      { tag: "rect", attrs: { x: 10.1, y: 1.7, width: 2.9, height: 8.4, rx: 1.45, fill: "#36C5F0" } },
      { tag: "rect", attrs: { x: 7.2, y: 1.7, width: 2.9, height: 2.9, rx: 1.45, fill: "#36C5F0" } },
    ]},
    { tag: "g", attrs: { transform: "rotate(90 12 12)" }, children: [
      { tag: "rect", attrs: { x: 10.1, y: 1.7, width: 2.9, height: 8.4, rx: 1.45, fill: "#2EB67D" } },
      { tag: "rect", attrs: { x: 7.2, y: 1.7, width: 2.9, height: 2.9, rx: 1.45, fill: "#2EB67D" } },
    ]},
    { tag: "g", attrs: { transform: "rotate(180 12 12)" }, children: [
      { tag: "rect", attrs: { x: 10.1, y: 1.7, width: 2.9, height: 8.4, rx: 1.45, fill: "#ECB22E" } },
      { tag: "rect", attrs: { x: 7.2, y: 1.7, width: 2.9, height: 2.9, rx: 1.45, fill: "#ECB22E" } },
    ]},
    { tag: "g", attrs: { transform: "rotate(270 12 12)" }, children: [
      { tag: "rect", attrs: { x: 10.1, y: 1.7, width: 2.9, height: 8.4, rx: 1.45, fill: "#E01E5A" } },
      { tag: "rect", attrs: { x: 7.2, y: 1.7, width: 2.9, height: 2.9, rx: 1.45, fill: "#E01E5A" } },
    ]},
  ]},
  // Discord's mask mark, in Discord blurple.
  discord: { shapes: [
    { tag: "path", attrs: { fill: "#5865F2", d:
      "M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z" } },
  ]},
  // Mattermost's mark, simplified to one rounded blue blob with a notch
  // bitten into its lower edge: closer to their flag shaped speech bubble
  // than to a bar chart, and it still reads as one mark at 20px.
  mattermost: { shapes: [
    { tag: "path", attrs: { fill: "#0058CC", d:
      "M7 2 L17 2 A5 5 0 0 1 22 7 L22 17 A5 5 0 0 1 17 22 L12 22 L9 16 L7 22 "
      + "A5 5 0 0 1 2 17 L2 7 A5 5 0 0 1 7 2 Z" } },
  ]},
  // Matrix's bracket wordmark, "[m]", in Matrix green.
  matrix: { shapes: [
    { tag: "path", attrs: { d: "M6 4 L4 4 L4 20 L6 20", fill: "none",
      stroke: "#0DBD8B", "stroke-width": "2",
      "stroke-linecap": "round", "stroke-linejoin": "round" } },
    { tag: "path", attrs: { d: "M18 4 L20 4 L20 20 L18 20", fill: "none",
      stroke: "#0DBD8B", "stroke-width": "2",
      "stroke-linecap": "round", "stroke-linejoin": "round" } },
    { tag: "text", text: "m", attrs: { x: 12, y: 16.5, fill: "#0DBD8B",
      "text-anchor": "middle", "font-size": "10", "font-weight": "700",
      "font-family": "system-ui,sans-serif" } },
  ]},
  // WhatsApp's speech bubble and handset, in WhatsApp green.
  whatsapp: { shapes: [
    { tag: "path", attrs: { fill: "#25D366", d:
      "M12 2 C6.5 2 2 6.4 2 12 c0 1.9 .5 3.7 1.5 5.3 L2 22 l4.9 -1.4 C8.4 21.5 10.1 22 12 22 c5.5 0 10 -4.4 10 -10 S17.5 2 12 2 Z" } },
    { tag: "path", attrs: { fill: "#fff", d:
      "M9.1 7.4 c-.3 -.6 -.5 -.6 -.8 -.6 h-.6 c-.3 0 -.7 .1 -1 .5 c-.3 .4 -1.3 1.2 -1.3 3 s1.3 3.5 1.5 3.7 c.2 .3 2.6 4 6.4 5.4 c3.1 1.2 3.8 1 4.5 .9 c.7 -.1 2.2 -.9 2.5 -1.8 c.3 -.9 .3 -1.6 .2 -1.8 c-.1 -.2 -.3 -.3 -.7 -.5 c-.4 -.2 -2.2 -1.1 -2.5 -1.2 c-.3 -.1 -.6 -.2 -.8 .2 c-.3 .4 -1 1.2 -1.2 1.5 c-.2 .2 -.4 .3 -.8 .1 c-.4 -.2 -1.6 -.6 -3 -1.9 c-1.1 -1 -1.9 -2.2 -2.1 -2.6 c-.2 -.4 0 -.6 .2 -.8 c.2 -.2 .4 -.4 .5 -.6 c.2 -.2 .2 -.4 .3 -.6 c.1 -.2 .1 -.5 0 -.7 c-.1 -.2 -.8 -2 -1.2 -2.8 Z" } },
  ]},
  // Signal's ring-shaped bubble mark, in Signal blue.
  signal: { shapes: [
    { tag: "circle", attrs: { cx: 12, cy: 12, r: 12, fill: "#3A76F0" } },
    { tag: "circle", attrs: { cx: 12, cy: 11, r: 5.5, fill: "none", stroke: "#fff", "stroke-width": "2.4" } },
    { tag: "path", attrs: { d: "M9.3 15.8 L7.3 18.3 L10.6 17.1 Z", fill: "#fff" } },
  ]},
  // No single brand owner for "email": a plain envelope in the page's text color.
  email: { shapes: [
    { tag: "rect", attrs: { x: 3, y: 5, width: 18, height: 14, rx: 2, fill: "none",
      stroke: "currentColor", "stroke-width": "1.6" } },
    { tag: "path", attrs: { d: "M4 6.5 L12 13 L20 6.5", fill: "none",
      stroke: "currentColor", "stroke-width": "1.6",
      "stroke-linecap": "round", "stroke-linejoin": "round" } },
  ]},
  // Microsoft Teams' purple badge with a bold "T" and its people dot, the
  // dot placed clear of the crossbar so it reads as a separate accent.
  teams: { shapes: [
    { tag: "rect", attrs: { x: 1, y: 1, width: 22, height: 22, rx: 5, fill: "#6264A7" } },
    { tag: "circle", attrs: { cx: 17.3, cy: 5.1, r: 1.9, fill: "#fff" } },
    { tag: "rect", attrs: { x: 5.5, y: 8, width: 11, height: 2.6, rx: 1.3, fill: "#fff" } },
    { tag: "rect", attrs: { x: 9.6, y: 8, width: 2.6, height: 10.4, rx: 1.3, fill: "#fff" } },
  ]},
};

function buildSvgNode(spec) {
  const el = document.createElementNS(SVG_NS, spec.tag);
  for (const key in spec.attrs || {}) el.setAttribute(key, spec.attrs[key]);
  if (spec.text !== undefined) el.textContent = spec.text;
  for (const child of spec.children || []) el.appendChild(buildSvgNode(child));
  return el;
}

// The channel icon: a real brand mark if LOGOS has one, otherwise the
// catalogue's emoji, so a channel added to CHANNEL_CATALOGUE without a
// matching entry here still shows something rather than an empty box.
function buildIcon(platform, fallbackEmoji) {
  const def = LOGOS[platform];
  if (!def) {
    const span = document.createElement("span");
    span.textContent = fallbackEmoji || "*";
    return span;
  }
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", "20");
  svg.setAttribute("height", "20");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  for (const shape of def.shapes) svg.appendChild(buildSvgNode(shape));
  return svg;
}

const BADGE = {
  connected: "Connected",
  available: "Ready to connect",
  off: "Not enabled here",
  planned: "Coming later",
};

// "Connected" alone does not answer the question a user actually has, which is
// whose bot is carrying their messages: the one IO runs and can see, or their
// own. That distinction is the whole point of bringing your own bot, so the
// badge names it. `via` is computed server-side, so every channel inherits this
// the moment it can carry a personal bot.
function badgeText(c) {
  if (c.status !== "connected") return BADGE[c.status] || c.status;
  if (c.via === "own") return "Connected · your bot";
  if (c.via === "shared") return "Connected · IO's bot";
  return BADGE.connected;
}

function setMsg(el, text, cls) {
  el.className = "msg" + (cls ? " " + cls : "");
  el.textContent = text;
}

// Just the quick connect fields: a note, the code input, the warning and its
// own feedback line. No outer .panel wrapper here, because buildExpand below
// is the one that owns that divider now, whether this sits alone or on top
// of the bot section.
function buildConnectFields(c) {
  const holder = document.createElement("div");

  const step = document.createElement("p");
  step.className = "step";
  step.textContent = c.note ? c.note : "Get a code, then paste it here.";
  holder.append(step);

  const entry = document.createElement("div");
  entry.className = "entry";
  const input = document.createElement("input");
  input.setAttribute("aria-label", "Pairing code for " + (c.label || c.platform));
  input.placeholder = "ABCD2345";
  input.maxLength = 24;
  const go = document.createElement("button");
  go.type = "button";
  go.className = "primary";
  go.textContent = "Connect";
  entry.append(input, go);
  holder.append(entry);

  const warn = document.createElement("p");
  warn.className = "warn";
  warn.textContent =
    "A code links whichever account asked for it to yours, giving it your "
    + "memory, your email assistant and your files. "
    + "Only paste a code you asked for yourself. "
    + "If someone sent you one, do not use it.";
  holder.append(warn);

  const msg = document.createElement("p");
  msg.className = "msg";
  holder.append(msg);

  go.addEventListener("click", async () => {
    go.disabled = true;
    setMsg(msg, "Checking...");
    try {
      // Same-origin on purpose: the browser sends the Open WebUI session
      // cookie and api-gateway turns it into X-User-Email.
      const res = await fetch("/tasks/gateway/link", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: input.value }),
      });
      const body = await res.json().catch(() => ({}));
      if (res.ok) {
        setMsg(msg, "Connected. Go back and send a message.", "ok");
        load();
        return;
      }
      setMsg(msg, res.status === 401
        ? "Sign in to IO first, then reload."
        : (body.detail || "That did not work. Ask for a new code."), "bad");
    } catch (err) {
      setMsg(msg, "Could not reach the server. Try again in a moment.", "bad");
    }
    go.disabled = false;
  });

  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go.click(); });
  return holder;
}

async function disconnect(platform, btn, msg) {
  btn.disabled = true;
  try {
    const res = await fetch("/tasks/gateway/connections/"
                            + encodeURIComponent(platform), { method: "DELETE" });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      setMsg(msg, body.detail || "Could not disconnect that.", "bad");
      btn.disabled = false;
      return;
    }
    load();
  } catch (err) {
    setMsg(msg, "Could not reach the server. Try again in a moment.", "bad");
    btn.disabled = false;
  }
}

// The plain way to unlink an already-connected account. Separate from
// "Remove bot" below: that deletes only a personal bot's saved credentials,
// this unlinks the pairing itself, which exists whether or not the account
// ever brought its own bot.
function buildDisconnectBlock(c) {
  const box = document.createElement("div");
  box.className = "botbox";

  const msg = document.createElement("p");
  msg.className = "msg";

  const btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = "Disconnect";
  btn.addEventListener("click", () => disconnect(c.platform, btn, msg));

  box.append(btn, msg);
  return box;
}

// One renderer for both paths, so a channel that gains a second way in later
// gets the same shape without new code.
function steps(items) {
  const list = document.createElement("ol");
  list.className = "steps";
  for (const item of items) {
    const li = document.createElement("li");
    if (typeof item === "string") {
      li.textContent = item;
    } else {
      li.append(...item);
    }
    list.append(li);
  }
  return list;
}

// A command someone has to type. Copy is a convenience, never the only way to
// get the text: this page runs inside an iframe, where clipboard-write can be
// refused, so the fallback selects the command for a manual copy.
function commandLine(text) {
  const wrap = document.createElement("div");
  wrap.className = "cmd";

  const code = document.createElement("code");
  code.textContent = text;

  const copy = document.createElement("button");
  copy.type = "button";
  copy.textContent = "Copy";
  copy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(text);
      copy.textContent = "Copied";
      setTimeout(() => { copy.textContent = "Copy"; }, 1500);
    } catch (err) {
      const range = document.createRange();
      range.selectNodeContents(code);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      copy.textContent = "Press Ctrl+C";
    }
  });

  wrap.append(code, copy);
  return wrap;
}

// The terminal is the one channel where the first step is "get the program".
// Built from location.origin so it stays correct on any host.
function terminalSteps() {
  const url = window.location.origin + "/tasks/static/io.py";

  const download = document.createElement("div");
  download.append(document.createTextNode("Download the client"),
                  commandLine("curl -fsSL " + url + " -o io.py"));

  const windows = document.createElement("div");
  windows.className = "why";
  windows.textContent = "On older Windows: iwr " + url + " -OutFile io.py";
  download.append(windows);

  const run = document.createElement("div");
  run.append(document.createTextNode("Run it"), commandLine("python io.py"));

  return steps([[download], [run], [document.createTextNode("Paste the code it prints below")]]);
}

// What a row shows once you open it. None of this exists until a click, which
// is what keeps a collapsed row to a single line and the page scannable.
//
// A channel that cannot take a bot never gets the bot section at all, so the
// page never prints a "Use my own bot" heading whose only content is a
// sentence saying no. Its reason is already on the collapsed row.
function buildExpand(c) {
  const panel = document.createElement("div");
  panel.className = "panel";

  if (c.status === "available") {
    const quick = document.createElement("div");
    quick.className = "botheadline";
    quick.textContent = c.can_bring_bot
      ? "Quick connect \u00b7 use IO's bot"
      : "Quick connect \u00b7 from your shell";
    panel.append(quick);

    if (c.platform === "cli") {
      panel.append(terminalSteps());
    } else if (c.note) {
      panel.append(steps([c.note, "It replies with a code",
                          "Paste it below"]));
    }

    panel.append(buildConnectFields(c));
  }

  if (c.status === "connected") {
    panel.append(buildDisconnectBlock(c));
  }

  if (c.can_bring_bot) {
    panel.append(botSection(c, load));
  }

  return panel;
}

// A bot the user brought themselves. Only ever called for a channel that can
// actually take one (see buildExpand), so a channel that cannot never shows
// this heading at all. The can_bring_bot branch just below stays unreachable
// from that caller on purpose: the sentence it prints is asserted on by
// test_gateway_page_bot_copy, which checks this file's source rather than
// what a click can reach.
function botSection(c, refresh) {
  const box = document.createElement("div");
  box.className = "botbox";

  const head = document.createElement("div");
  head.className = "botheadline";
  head.textContent = "Use my own bot";
  box.appendChild(head);

  if (!c.can_bring_bot) {
    const why = document.createElement("p");
    why.className = "why";
    // Deliberately NOT c.note. That is the channel's general status, already
    // shown above, and reusing it prints the same sentence twice, or worse,
    // shows Terminal's pairing instructions as if they explained bot support.
    why.textContent = c.label + " cannot take your own bot yet.";
    box.appendChild(why);
    return box;
  }

  if (c.bot) {
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = c.bot.bot_username
      ? "Your bot @" + c.bot.bot_username
      : "Your bot is saved.";
    box.appendChild(who);

    if (c.bot.last_error) {
      const bad = document.createElement("p");
      bad.className = "why";
      bad.textContent = "Telegram said: " + c.bot.last_error;
      box.appendChild(bad);
    }

    const msg = document.createElement("p");
    msg.className = "msg";

    const row = document.createElement("div");
    row.className = "botactions";

    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.textContent = c.bot.enabled ? "Turn off" : "Turn on";
    toggle.onclick = async () => {
      toggle.disabled = true;
      try {
        const res = await fetch("/tasks/gateway/bots/" + encodeURIComponent(c.bot.bot_key), {
          method: "PATCH",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({enabled: !c.bot.enabled}),
        });
        if (res.ok) { refresh(); return; }
        setMsg(msg, "That did not take. Try again.");
      } catch (err) {
        setMsg(msg, "Could not reach the server. Try again in a moment.", "bad");
      }
      toggle.disabled = false;
    };

    const test = document.createElement("button");
    test.type = "button";
    test.textContent = "Test";
    test.onclick = async () => {
      test.disabled = true;
      setMsg(msg, "Asking Telegram...");
      try {
        const res = await fetch("/tasks/gateway/bots/" + encodeURIComponent(c.bot.bot_key) + "/test",
                                {method: "POST"});
        const body = await res.json().catch(() => ({}));
        setMsg(msg, body.detail || "Could not reach the server.");
      } catch (err) {
        setMsg(msg, "Could not reach the server. Try again in a moment.", "bad");
      }
      test.disabled = false;
    };

    const edit = document.createElement("button");
    edit.type = "button";
    edit.textContent = "Edit";
    edit.onclick = () => { box.replaceChildren(head, botForm(c, refresh)); };

    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "Remove bot";
    remove.onclick = async () => {
      remove.disabled = true;
      try {
        const res = await fetch("/tasks/gateway/bots/" + encodeURIComponent(c.bot.bot_key),
                                {method: "DELETE"});
        if (res.ok) { refresh(); return; }
        setMsg(msg, "Could not remove it. Try again.");
      } catch (err) {
        setMsg(msg, "Could not reach the server. Try again in a moment.", "bad");
      }
      remove.disabled = false;
    };

    row.append(toggle, test, edit, remove);
    box.append(row, msg);
    return box;
  }

  box.appendChild(botForm(c, refresh));
  return box;
}

function botForm(c, refresh) {
  const form = document.createElement("div");

  const pitch = document.createElement("p");
  pitch.className = "why";
  pitch.textContent =
    "Your bot, your token, your data. Nobody else can see it or configure it. " +
    "Saving it lets IO send messages as that bot.";
  form.appendChild(pitch);

  const tokenLabel = document.createElement("div");
  tokenLabel.className = "fieldlabel";
  tokenLabel.textContent = "BOT TOKEN";
  const token = document.createElement("input");
  token.type = "password";
  token.placeholder = "paste the token";
  const tokenHelp = document.createElement("p");
  tokenHelp.className = "why";
  tokenHelp.textContent = "Get one from BotFather on Telegram.";

  const idsLabel = document.createElement("div");
  idsLabel.className = "fieldlabel";
  idsLabel.textContent = "ALLOWED TELEGRAM USER IDS";
  const ids = document.createElement("input");
  ids.type = "text";
  ids.placeholder = "leave empty for just you";
  ids.value = (c.bot && c.bot.allowed_ids) || "";

  const msg = document.createElement("p");
  msg.className = "msg";

  const save = document.createElement("button");
  save.type = "button";
  save.className = "primary";
  save.textContent = "SAVE & ENABLE";
  save.onclick = async () => {
    const value = token.value.trim();
    if (!value) { setMsg(msg, "Paste your bot token first."); return; }
    save.disabled = true;
    setMsg(msg, "Checking it with Telegram...");
    try {
      const res = await fetch("/tasks/gateway/bots", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({platform: c.platform, token: value,
                              allowed_ids: ids.value}),
      });
      const body = await res.json().catch(() => ({}));
      token.value = "";
      if (!res.ok) { setMsg(msg, body.detail || "That did not work."); save.disabled = false; return; }
      refresh();
      return;
    } catch (err) {
      token.value = "";
      setMsg(msg, "Could not reach the server. Try again in a moment.", "bad");
    }
    save.disabled = false;
  };

  form.append(tokenLabel, token, tokenHelp, idsLabel, ids, save, msg);
  return form;
}

function render(connections) {
  listEl.replaceChildren();
  let joined = 0;
  for (const c of connections) {
    if (c.status === "connected") joined += 1;

    const row = document.createElement("li");
    row.className = "row";
    if (c.status === "planned" || c.status === "off") row.classList.add("dim");

    const head = document.createElement("div");
    head.className = "head";

    const icon = document.createElement("span");
    icon.className = "icon";
    icon.appendChild(buildIcon(c.platform, c.icon));

    const naming = document.createElement("div");
    naming.className = "naming";
    const titleline = document.createElement("div");
    titleline.className = "titleline";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = c.label || c.platform;
    const badge = document.createElement("span");
    badge.className = "badge" + (c.status === "connected" ? " on" : "");
    badge.textContent = badgeText(c);
    titleline.append(name, badge);

    const blurb = document.createElement("div");
    blurb.className = "blurb";
    blurb.textContent = c.blurb || "";
    naming.append(titleline, blurb);

    if (c.status === "connected" && c.name) {
      // Naming the account is the only way to notice that a code you were
      // talked into pasting linked somebody else's app to your Brain.
      const who = document.createElement("div");
      who.className = "why";
      who.textContent = c.via_label
        ? c.via_label + ", connected as " + c.name
        : "Connected as " + c.name;
      naming.append(who);
    } else if (c.via === "offer" && c.via_label) {
      // Says which bot would carry you BEFORE you connect. Without this the
      // row reads only "ready to connect" and nothing on the page reveals
      // that bringing your own bot is possible at all.
      const offer = document.createElement("div");
      offer.className = "why";
      offer.textContent = c.via_label;
      naming.append(offer);
    } else if (c.status !== "available" && c.note) {
      const why = document.createElement("div");
      why.className = "why";
      why.textContent = c.note;
      naming.append(why);
    }

    head.append(icon, naming);

    const msg = document.createElement("p");
    msg.className = "msg";

    // Hermes puts the same control in the same place on every row. A channel
    // that cannot do anything yet gets that control visibly disabled rather
    // than missing, so the column still lines up and nothing pretends to work.
    const canOpen = c.status === "available" || c.status === "connected"
                    || c.can_bring_bot;
    const openLabel = c.status === "connected" ? "Manage" : "Connect";

    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = openLabel;

    if (!canOpen) {
      btn.disabled = true;
      // Deliberately not c.note. The reason is already printed on the row
      // right below this, and repeating it here is the same duplication the
      // bot section had.
      btn.title = c.label + " is not ready yet.";
    } else {
      btn.addEventListener("click", () => {
        // Expands in place. Opening a second row closes the first, so there is
        // only ever one code box on screen to paste into.
        const mine = row.querySelector(".panel");
        if (mine) {
          mine.remove();
          openPanel = null;
          btn.textContent = openLabel;
          return;
        }
        if (openPanel) {
          const other = openPanel.row.querySelector(".panel");
          if (other) other.remove();
          openPanel.btn.textContent = openPanel.label;
        }
        row.append(buildExpand(c));
        btn.textContent = "Close";
        openPanel = { row: row, btn: btn, label: openLabel };
        const firstField = row.querySelector(".panel input");
        if (firstField) firstField.focus();
      });
    }
    head.append(btn);

    row.append(head, msg);
    listEl.append(row);
  }
  countEl.textContent = joined + " of " + connections.length
    + " channels connected to your account.";
}

async function load() {
  openPanel = null;
  try {
    const res = await fetch("/tasks/gateway/connections");
    if (res.status === 401) {
      listEl.replaceChildren();
      countEl.textContent = "Sign in to IO first, then reload this page.";
      return;
    }
    const body = await res.json();
    render(body.connections || []);
  } catch (err) {
    listEl.replaceChildren();
    countEl.textContent = "Could not load your channels. Try again in a moment.";
  }
}

// The channel list is static (CHANNEL_CATALOGUE never varies per request),
// so the server injects it as window.__CHANNELS__ ahead of this script. Draw
// from that immediately, with no per-user status yet (every row's linked_at
// is null), and let load() below fill in this account's real status once
// the network call returns. If the page was served without injection (the
// raw file, opened some other way), window.__CHANNELS__ is missing and the
// list is simply left at its "Loading..." markup until load() finishes.
if (window.__CHANNELS__) {
  render(window.__CHANNELS__);
}

load();
</script>
</body>
</html>
