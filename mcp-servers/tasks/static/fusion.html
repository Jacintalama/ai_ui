<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fusion</title>
  <script src="/tasks/static/vendor/htmx.min.js"></script>
  <script src="/tasks/static/vendor/sse.js"></script>
  <script src="/tasks/static/vendor/marked.min.js"></script>
  <script src="/tasks/static/vendor/purify.min.js"></script>
  <style>
    /* Open WebUI look. The palette, font stack and radii below are lifted
       verbatim from the running Open WebUI build so this page reads as native:
       greys are its oklch --color-gray-* scale, and Inter comes from the very
       same file Open WebUI serves (already warm in the browser cache). */
    @font-face {
      font-family: Inter;
      src: url(/assets/fonts/Inter-Variable.ttf);
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      --gray-50: oklch(98% 0 0);
      --gray-100: oklch(94% 0 0);
      --gray-300: oklch(85% 0 0);
      --gray-400: oklch(77% 0 0);
      --gray-500: oklch(69% 0 0);
      --gray-600: oklch(51% 0 0);
      --gray-700: oklch(42% 0 0);
      --gray-800: oklch(32% 0 0);
      --gray-850: oklch(27% 0 0);
      --gray-900: oklch(20% 0 0);
      --gray-950: oklch(16% 0 0);

      /* Roles, mapped the way Open WebUI maps them in dark mode. */
      --bg: var(--gray-900);        /* main content surface */
      --panel: var(--gray-950);     /* recessed card */
      --field: var(--gray-850);     /* inputs, chips, avatars */
      --hair: var(--gray-850);      /* borders */
      --hair-2: var(--gray-800);
      --text: var(--gray-100);
      --muted: var(--gray-400);
      --faint: var(--gray-500);
      --user: var(--gray-800);      /* user message bubble */
      --active: var(--gray-800);
      --teal: #10a37f;
      --rust: #d97757;
      --warn: #e0a13a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: row;
      background: var(--bg); color: var(--text);
      font-size: 15px; line-height: 1.55;
      font-family: -apple-system, BlinkMacSystemFont, Inter, Vazirmatn, ui-sans-serif,
        system-ui, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif,
        "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      -webkit-font-smoothing: antialiased;
    }

    /* Sidebar, sitting on Open WebUI's gray-950 like its own does. Fusion keeps
       no history yet, so this is a shell: a way back and a way to start over. */
    .sidebar {
      width: 260px; flex: none; display: flex; flex-direction: column; gap: 2px;
      padding: 8px; background: var(--gray-950); border-right: 1px solid var(--hair);
    }
    .sidelink {
      display: flex; align-items: center; gap: 9px; padding: 8px 10px;
      border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 14px;
      background: transparent; border: none; font-family: inherit; cursor: pointer;
      width: 100%; text-align: left;
    }
    .sidelink:hover { background: var(--gray-850); color: var(--text); }
    .sidelink svg { flex: none; }
    .sidesep { height: 1px; background: var(--hair); margin: 8px 2px; }
    .sidenote { color: var(--faint); font-size: 12px; line-height: 1.5; padding: 2px 10px; }
    .sidefoot { margin-top: auto; }

    /* Saved chats */
    .chatlist { overflow-y: auto; display: flex; flex-direction: column; gap: 1px;
      scrollbar-width: thin; scrollbar-color: var(--gray-700) transparent; }
    .chatrow { display: flex; align-items: center; border-radius: 8px; }
    .chatrow:hover, .chatrow.active { background: var(--gray-850); }
    .chatopen {
      flex: 1; min-width: 0; text-align: left; padding: 8px 10px; font-size: 14px;
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-family: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chatrow:hover .chatopen, .chatrow.active .chatopen { color: var(--text); }
    .chatdel {
      flex: none; padding: 4px 9px; background: none; border: none; cursor: pointer;
      color: var(--faint); font-size: 16px; line-height: 1; visibility: hidden;
    }
    .chatrow:hover .chatdel { visibility: visible; }
    .chatdel:hover { color: #ff7a7a; }

    /* The page body sits to the right of the sidebar. */
    .app { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    /* Slim top bar (Open WebUI keeps this minimal) */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 18px; border-bottom: 1px solid var(--hair);
    }
    header .back { display: none; width: auto; color: var(--muted); }
    header .title { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; }
    header .mark {
      width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
      background: var(--field); color: var(--text);
    }
    .spacer { flex: 1; }
    /* Stage: centers in the hero (empty) state, scrolls in chat. */
    .stage { flex: 1; min-height: 0; width: 100%; position: relative;
      display: flex; flex-direction: column; }

    .hero-head { text-align: center; }
    .hero-head h2 { margin: 0 0 6px; font-size: clamp(20px, 3vw, 27px); font-weight: 600;
      letter-spacing: -0.01em; text-wrap: balance; }
    .hero-head p { margin: 0; color: var(--muted); font-size: 14px; }

    /* Chat thread */
    #thread {
      overflow-y: auto; padding: 26px 20px;
      display: flex; flex-direction: column; gap: 22px;
      max-width: 820px; width: 100%; margin: 0 auto;
    }
    .msg { display: flex; }
    /* User: small gray pill, right-aligned. */
    .msg.user { justify-content: flex-end; }
    /* rounded-3xl / px-5 py-3, the same shape Open WebUI gives user turns. */
    .msg.user .bubble {
      background: var(--user); color: var(--text); border-radius: 24px;
      padding: 12px 20px; max-width: 76%; white-space: pre-wrap; word-wrap: break-word;
    }
    /* Assistant: avatar + name + plain full-width text (no bubble). */
    .msg.assistant { gap: 12px; align-items: flex-start; }
    .msg.assistant .avatar {
      width: 28px; height: 28px; border-radius: 8px; flex: none; margin-top: 1px;
      background: var(--field); color: var(--text); display: grid; place-items: center;
    }
    .msg.assistant .body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .msg.assistant .who { font-weight: 600; font-size: 14px; }
    /* pre-wrap while raw tokens stream in; .done drops it once the finished
       answer has been parsed to real markdown, so block margins can breathe. */
    .msg.assistant .text { white-space: pre-wrap; word-wrap: break-word; line-height: 1.6; }
    .msg.assistant .text.done { white-space: normal; }
    .msg.assistant .credit { color: var(--faint); font-size: 12px; margin-top: 8px; }

    /* Rendered markdown */
    .text h1, .text h2, .text h3 { font-size: 1.05em; margin: 1.1em 0 .4em; }
    .text p { margin: 0 0 .85em; }
    .text > *:last-child { margin-bottom: 0; }
    .text ul, .text ol { margin: 0 0 .85em; padding-left: 1.4em; }
    .text li { margin: .2em 0; }
    .text a { color: var(--gray-300); text-decoration: underline; }
    .text strong { font-weight: 600; color: var(--gray-50); }
    .text code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .88em; background: var(--gray-850); border: 1px solid var(--hair-2);
      border-radius: 5px; padding: 1px 5px;
    }
    .text pre {
      background: var(--gray-950); border: 1px solid var(--hair);
      border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 0 0 .85em;
    }
    .text pre code { background: none; border: none; padding: 0; font-size: .85em; }
    .text blockquote {
      margin: 0 0 .85em; padding-left: 12px;
      border-left: 2px solid var(--hair-2); color: var(--muted);
    }
    .text table { border-collapse: collapse; margin: 0 0 .85em; display: block; overflow-x: auto; }
    .text th, .text td { border: 1px solid var(--hair-2); padding: 6px 10px; text-align: left; }
    .text hr { border: none; border-top: 1px solid var(--hair); margin: 1.2em 0; }
    /* System notices */
    .msg.system { color: var(--warn); font-size: 13px; }
    .msg.system .bubble { color: var(--warn); }

    /* Dock: picker + composer */
    .dock { width: 100%; display: flex; flex-direction: column; gap: 10px; }

    /* Model picker, restyled neutral to blend with Open WebUI */
    .picker {
      width: 100%; padding: 13px 15px; display: flex; flex-direction: column; gap: 11px;
      background: var(--panel); border: 1px solid var(--hair); border-radius: 16px;
    }
    .picker .tabs { display: inline-flex; gap: 5px; background: var(--bg);
      padding: 4px; border-radius: 10px; border: 1px solid var(--hair); width: fit-content; }
    .picker .tab { padding: 5px 14px; border-radius: 7px; font-size: 13px; cursor: pointer;
      background: transparent; color: var(--muted); border: none; font: inherit; }
    .picker .tab:hover:not(.passive) { color: var(--text); }
    .picker .tab.active { background: var(--active); color: var(--gray-50); }
    .picker .tab.passive { cursor: default; color: var(--faint); }
    .picker .tab.passive.active { background: var(--active); color: var(--text); }
    .picker .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .picker .rlabel { font-size: 11px; letter-spacing: .4px; text-transform: uppercase;
      color: var(--faint); min-width: 68px; }
    .picker .chip { display: inline-flex; align-items: center; gap: 7px; font-size: 13px;
      padding: 6px 11px; border-radius: 10px; background: var(--field); border: 1px solid var(--hair); }
    .picker .chip .x { background: transparent; border: none; color: var(--muted); cursor: pointer;
      font-size: 16px; line-height: 1; padding: 0; margin-left: 1px; }
    .picker .chip .x:hover { color: #ff7a7a; }
    .picker .addbtn { display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 13px;
      padding: 6px 12px; border-radius: 10px; cursor: pointer;
      background: transparent; color: var(--muted); border: 1px dashed var(--hair-2); }
    .picker .addbtn:hover { background: var(--gray-850); border-color: var(--gray-700); color: var(--text); }
    .picker select.judge { background: var(--bg); color: var(--text); border: 1px solid var(--hair);
      border-radius: 10px; padding: 7px 11px; font: inherit; font-size: 13px; cursor: pointer; }
    .picker select.judge:focus { outline: none; border-color: var(--hair-2); }

    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
    .dot.openai { background: var(--teal); }
    .dot.anthropic { background: var(--rust); }
    .dot.openrouter { background: #a78bfa; }

    /* Add-model modal */
    .modal-backdrop { display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(0, 0, 0, 0.55); align-items: flex-start; justify-content: center; padding: 12vh 16px; }
    .modal-backdrop.open { display: flex; }
    .modal { width: 100%; max-width: 460px; max-height: 62vh; display: flex; flex-direction: column;
      background: var(--gray-850); border: 1px solid var(--hair-2); border-radius: 16px; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); }
    .modal-head { display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--hair); font-weight: 600; }
    .modal-head .mx { background: transparent; border: none; color: var(--muted); font-size: 20px;
      line-height: 1; cursor: pointer; padding: 0; }
    .modal-head .mx:hover { color: var(--text); }
    .msearch { margin: 12px 16px 6px; padding: 9px 12px; border-radius: 10px;
      background: var(--bg); color: var(--text); border: 1px solid var(--hair); font: inherit; font-size: 14px; }
    .msearch:focus { outline: none; border-color: var(--hair-2); }
    .mlist { overflow-y: auto; padding: 6px 8px 12px; display: flex; flex-direction: column; gap: 2px; }
    .mrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 10px 12px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 14px;
      background: transparent; border: none; color: var(--text); }
    .mrow:hover { background: var(--gray-800); }
    .mrow .mname { flex: 1; }
    .mrow .mprov { font-size: 11px; color: var(--muted); }

    /* Composer: one rounded field with a circular send button (Open WebUI style) */
    form.composer { width: 100%; }
    .inputwrap {
      display: flex; align-items: flex-end; gap: 8px; width: 100%;
      background: var(--field); border: 1px solid var(--hair-2); border-radius: 24px;
      padding: 7px 7px 7px 18px;
    }
    .inputwrap:focus-within { border-color: var(--hair-2); }
    textarea {
      flex: 1; resize: none; min-height: 26px; max-height: 170px; padding: 8px 0;
      background: transparent; color: var(--text); border: none; font: inherit; line-height: 1.5;
      overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--gray-700) transparent;
    }
    textarea::-webkit-scrollbar { width: 8px; }
    textarea::-webkit-scrollbar-track { background: transparent; }
    textarea::-webkit-scrollbar-thumb { background: var(--gray-700); border-radius: 8px; }
    textarea::-webkit-scrollbar-button { display: none; height: 0; }
    textarea:focus { outline: none; }
    textarea::placeholder { color: var(--faint); }
    button.send {
      width: 36px; height: 36px; flex: none; border-radius: 50%; border: none; cursor: pointer;
      background: var(--gray-100); color: var(--gray-900); display: grid; place-items: center;
    }
    button.send:hover { background: var(--gray-50); }
    button.send:disabled { opacity: .35; cursor: default; }
    .hint { text-align: center; color: var(--faint); font-size: 11.5px; margin: 8px 0 0; }

    /* ---- HERO state (no conversation yet) ---- */
    body:not(.chat) .stage { justify-content: center; align-items: center; gap: 18px; padding: 24px; }
    body:not(.chat) #thread { display: none; }
    body:not(.chat) .dock { max-width: 620px; }

    /* ---- CHAT state ---- */
    body.chat .hero-head { display: none; }
    body.chat #thread { flex: 1; }
    body.chat .dock { max-width: 820px; margin: 0 auto; padding: 8px 20px 16px; }
    body.chat .hint { display: none; }

    /* Narrow screens: drop the sidebar, keep the way back in the top bar. */
    @media (max-width: 860px) {
      .sidebar { display: none; }
      header .back { display: grid; place-items: center; }
    }
    /* Composer tools (web search), inline inside the input pill */
    .inputwrap { padding-left: 7px; }
    button.tool {
      flex: none; margin-bottom: 1px;
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      padding: 5px 11px; border-radius: 999px; font: inherit; font-size: 12.5px;
      background: transparent; color: var(--muted);
      border: 1px solid var(--hair-2);
    }
    button.tool:hover { color: var(--text); background: var(--gray-800); }
    button.tool.on { background: var(--teal); border-color: var(--teal); color: #fff; }
    button.tool.on:hover { background: #0d8c6d; }
    .pickhint { color: var(--faint); font-size: 13px; }
  </style>
</head>
<body>
  <nav class="sidebar">
    <a class="sidelink" href="/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Open WebUI
    </a>

    <button class="sidelink" hx-post="/tasks/fusion/new"
            hx-target="#thread" hx-swap="innerHTML">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
      </svg>
      New chat
    </button>

    <div class="sidesep"></div>
    <div id="chatlist" hx-get="/tasks/fusion/chats"
         hx-trigger="load, fusion-chats-changed from:body"
         hx-swap="outerHTML"></div>

    <div class="sidefoot">
      <div class="sidesep"></div>
      <a class="sidelink" href="/">Back to the main site</a>
    </div>
  </nav>

  <div class="app">
  <header>
    <a class="sidelink back" href="/" aria-label="Back to Open WebUI">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <span class="title">
      <span class="mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <path d="M5 4v3.5a5.5 5.5 0 0 0 5.5 5.5H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M19 4v3.5A5.5 5.5 0 0 1 13.5 13H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 13v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polyline points="9 16.5 12 19.5 15 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      Fusion
    </span>
    <div class="spacer"></div>
  </header>

  <main class="stage">
    <div class="hero-head">
      <h2>What should the panel answer?</h2>
      <p>Pick your models, ask once, and get one combined answer.</p>
    </div>

    <div id="thread"></div>

    <div class="dock">
      <div id="picker" class="picker" hx-get="/tasks/fusion/picker"
           hx-trigger="load" hx-swap="outerHTML"></div>

      <form class="composer" hx-post="/tasks/fusion/send"
            hx-target="#thread" hx-swap="beforeend"
            hx-on::after-request="if(event.detail.successful){this.querySelector('textarea').value='';}">
        <div class="inputwrap">
          <span id="searchbtn" hx-get="/tasks/fusion/search/button"
                hx-trigger="load" hx-swap="outerHTML"></span>
          <textarea name="message" placeholder="Send a message" rows="1"
                    autocomplete="off" required></textarea>
          <button class="send" type="submit" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 20V5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M6 11l6-6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </form>
      <p class="hint">Fusion sends your prompt to every chosen model and a judge combines them.</p>
    </div>
  </main>
  </div>

  <script>
    // Toggle the hero/chat layout based on whether the thread holds any message.
    function syncLayout() {
      document.body.classList.toggle(
        'chat', !!document.querySelector('#thread .msg'));
    }

    // Auth: attach the OWUI login token as a Bearer header on HTMX requests.
    // The SSE stream (EventSource) cannot send headers, so it relies on the
    // same-origin OWUI cookie instead; that path needs nothing here.
    document.body.addEventListener('htmx:configRequest', function (e) {
      var token = localStorage.getItem('token');
      if (token) { e.detail.headers['Authorization'] = 'Bearer ' + token; }
    });

    // The picker is server-rendered, and this box is a 300-500ms round trip
    // away, so a tab used to sit dead until the response landed. Move the
    // highlight on click; the swap that follows reconciles it (and the chips).
    document.body.addEventListener('click', function (e) {
      var tab = e.target.closest ? e.target.closest('.picker .tab') : null;
      if (!tab || !tab.parentElement) { return; }
      var tabs = tab.parentElement.querySelectorAll('.tab');
      for (var i = 0; i < tabs.length; i++) { tabs[i].classList.remove('active'); }
      tab.classList.add('active');
    });

    // Add-model modal (re-rendered inside #picker on every swap; helpers are
    // global and look the element up by id each time).
    function openAddModal() {
      var m = document.getElementById('addModal');
      if (m) {
        m.classList.add('open');
        var s = m.querySelector('.msearch');
        if (s) { s.value = ''; s.focus(); }
        filterModels('');
      }
    }
    function closeAddModal() {
      var m = document.getElementById('addModal');
      if (m) { m.classList.remove('open'); }
    }
    function filterModels(q) {
      q = (q || '').toLowerCase();
      var rows = document.querySelectorAll('#addModal .mrow');
      for (var i = 0; i < rows.length; i++) {
        var name = rows[i].getAttribute('data-name') || '';
        rows[i].style.display = name.indexOf(q) >= 0 ? '' : 'none';
      }
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeAddModal(); }
    });

    // Enter sends, Shift+Enter makes a newline. Auto-grow the textarea.
    var ta = document.querySelector('textarea');
    function grow() { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 170) + 'px'; }
    ta.addEventListener('input', grow);
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.querySelector('form.composer button.send').click();
      }
    });

    // Disable Send while a turn is streaming; re-enable when the stream closes.
    var sendBtn = document.querySelector('button.send');
    document.body.addEventListener('htmx:afterSwap', function () {
      syncLayout();
      // Answers replayed from a saved chat arrive as raw markdown text and are
      // already complete, so render them straight away.
      var replayed = document.querySelectorAll('.msg.assistant .text.md');
      for (var i = 0; i < replayed.length; i++) { renderMarkdown(replayed[i]); }
      var streaming = document.querySelector('[sse-connect]');
      sendBtn.disabled = !!streaming;
      ta.style.height = 'auto';
      var thread = document.getElementById('thread');
      thread.scrollTop = thread.scrollHeight;
    });
    // Tokens stream in as plain text, so the raw markdown is on screen while
    // the answer is being written. Once the turn closes, parse the finished
    // text into HTML. marked does not sanitize, and this is model output, so
    // DOMPurify runs on the result before it ever touches innerHTML.
    function renderMarkdown(el) {
      if (!el || el.classList.contains('done')) { return; }
      if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') { return; }
      el.innerHTML = DOMPurify.sanitize(marked.parse(el.textContent));
      el.classList.add('done');
    }

    document.body.addEventListener('htmx:sseClose', function () {
      // The sse extension leaves sse-connect on the element after closing it.
      // Drop it, so the live-stream check above cannot match a finished turn
      // and strand the Send button disabled.
      var el = document.querySelector('.msg.assistant .text[sse-connect]');
      if (el) {
        el.removeAttribute('sse-connect');
        renderMarkdown(el);
      }
      sendBtn.disabled = false;
    });
    document.body.addEventListener('htmx:sseMessage', function () {
      var thread = document.getElementById('thread');
      thread.scrollTop = thread.scrollHeight;
    });

    // If auth fails, tell the user to sign in.
    document.body.addEventListener('htmx:responseError', function (e) {
      if (e.detail.xhr && (e.detail.xhr.status === 401 || e.detail.xhr.status === 403)) {
        var thread = document.getElementById('thread');
        thread.insertAdjacentHTML('beforeend',
          '<div class="msg system"><div class="bubble">Please sign in to Open WebUI and reload this page.</div></div>');
        syncLayout();
      }
    });

    syncLayout();
  </script>
</body>
</html>
