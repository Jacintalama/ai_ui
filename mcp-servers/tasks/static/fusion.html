<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fusion</title>
  <script src="/tasks/static/vendor/htmx.min.js"></script>
  <script src="/tasks/static/vendor/sse.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background:
        radial-gradient(1200px 500px at 50% -10%, #16203a 0%, rgba(22,32,58,0) 60%),
        #0d0f14;
      color: #e6e8eb;
      font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Header / brand */
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 22px; border-bottom: 1px solid #1b1f2b;
      background: rgba(15, 17, 21, 0.7); backdrop-filter: blur(8px);
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand .logo {
      width: 34px; height: 34px; border-radius: 10px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #2b6cff, #7a3cff);
      box-shadow: 0 4px 14px rgba(43, 108, 255, 0.35);
    }
    .brand .name { display: flex; flex-direction: column; line-height: 1.15; }
    .brand .name b { font-size: 16px; font-weight: 700; letter-spacing: .2px; }
    .brand .name small { font-size: 11px; color: #7d8494; }
    .spacer { flex: 1; }
    button.ghost {
      background: transparent; color: #aeb4c0; border: 1px solid #2a2f3d;
      border-radius: 9px; padding: 7px 13px; cursor: pointer; font-size: 13px;
    }
    button.ghost:hover { color: #fff; border-color: #3a4152; background: #171a22; }

    /* Stage: the flexible area between header and the bottom of the window. It
       centers everything in the hero (empty) state and becomes a scrolling
       chat once a conversation starts. State is driven by `body.chat`. */
    .stage {
      flex: 1; min-height: 0; width: 100%; position: relative;
      display: flex; flex-direction: column;
    }

    .hero-head { text-align: center; }
    .hero-head h2 {
      margin: 0 0 6px; font-size: clamp(21px, 3.2vw, 29px); font-weight: 700;
      letter-spacing: -0.02em; text-wrap: balance;
    }
    .hero-head p { margin: 0; color: #7d8494; font-size: 14px; }

    /* Chat thread */
    #thread {
      overflow-y: auto; padding: 26px 20px;
      display: flex; flex-direction: column; gap: 16px;
      max-width: 860px; width: 100%; margin: 0 auto;
    }
    .msg { display: flex; }
    .msg.user { justify-content: flex-end; }
    .msg.assistant, .msg.system { justify-content: flex-start; }
    .bubble {
      max-width: 80%; padding: 11px 15px; border-radius: 14px;
      white-space: pre-wrap; word-wrap: break-word;
    }
    .msg.user .bubble { background: linear-gradient(135deg, #2b6cff, #4f7dff); color: #fff; }
    .msg.assistant .bubble { background: #14171f; border: 1px solid #232838; }
    .msg.system .bubble, .msg.system { color: #f0b429; font-size: 13px; }

    /* Dock: holds the picker card + composer. Its max-width differs by state:
       a narrow hero column, or the full 860 chat column pinned to the bottom. */
    .dock { width: 100%; display: flex; flex-direction: column; gap: 10px; }

    /* Picker card (fills the dock now; the dock owns the outer width) */
    .picker {
      width: 100%; padding: 14px 16px;
      display: flex; flex-direction: column; gap: 12px;
      background: #12141b; border: 1px solid #212636; border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    }
    .picker .tabs { display: inline-flex; gap: 6px; background: #0f1117;
      padding: 4px; border-radius: 11px; border: 1px solid #1e2333; width: fit-content; }
    .picker .tab {
      padding: 6px 15px; border-radius: 8px; font-size: 13px; cursor: pointer;
      background: transparent; color: #aeb4c0; border: none; font: inherit;
    }
    .picker .tab:hover:not(.passive) { color: #fff; }
    .picker .tab.active { background: #2b6cff; color: #fff; box-shadow: 0 2px 8px rgba(43,108,255,.4); }
    .picker .tab.passive { cursor: default; color: #6b7280; }
    .picker .tab.passive.active { background: #232838; color: #cfd4de; }
    .picker .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .picker .rlabel {
      font-size: 11px; letter-spacing: .5px; text-transform: uppercase;
      color: #6b7280; min-width: 70px;
    }
    .picker .chip {
      display: inline-flex; align-items: center; gap: 7px; font-size: 13px;
      padding: 6px 11px; border-radius: 10px; background: #1a1e29; border: 1px solid #2a3040;
    }
    .picker .chip .x {
      background: transparent; border: none; color: #7d8494; cursor: pointer;
      font-size: 16px; line-height: 1; padding: 0; margin-left: 1px;
    }
    .picker .chip .x:hover { color: #ff6b6b; }
    .picker .addbtn {
      display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 13px;
      padding: 6px 12px; border-radius: 10px; cursor: pointer;
      background: transparent; color: #6ea0ff; border: 1px dashed #37507e;
    }
    .picker .addbtn:hover { background: #141a29; border-color: #4f7dff; color: #9dbcff; }
    .picker select.judge {
      background: #0f1117; color: #e6e8eb; border: 1px solid #2a3040;
      border-radius: 10px; padding: 7px 11px; font: inherit; font-size: 13px; cursor: pointer;
    }
    .picker select.judge:focus { outline: none; border-color: #2b6cff; }

    /* Provider dot */
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
    .dot.openai { background: #10a37f; }
    .dot.anthropic { background: #d97757; }

    /* Add-model modal */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(6, 8, 12, 0.6); backdrop-filter: blur(3px);
      align-items: flex-start; justify-content: center; padding: 12vh 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%; max-width: 460px; max-height: 62vh; display: flex; flex-direction: column;
      background: #14161e; border: 1px solid #262c3c; border-radius: 16px; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid #1f2430; font-weight: 600;
    }
    .modal-head .mx {
      background: transparent; border: none; color: #7d8494; font-size: 20px;
      line-height: 1; cursor: pointer; padding: 0;
    }
    .modal-head .mx:hover { color: #fff; }
    .msearch {
      margin: 12px 16px 6px; padding: 9px 12px; border-radius: 10px;
      background: #0f1117; color: #e6e8eb; border: 1px solid #2a3040; font: inherit; font-size: 14px;
    }
    .msearch:focus { outline: none; border-color: #2b6cff; }
    .mlist { overflow-y: auto; padding: 6px 8px 12px; display: flex; flex-direction: column; gap: 2px; }
    .mrow {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 10px 12px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 14px;
      background: transparent; border: none; color: #e6e8eb;
    }
    .mrow:hover { background: #1c2130; }
    .mrow .mname { flex: 1; }
    .mrow .mprov { font-size: 11px; color: #7d8494; }

    /* Composer (fills the dock) */
    form.composer { display: flex; gap: 10px; width: 100%; }
    textarea {
      flex: 1; resize: none; height: 48px; max-height: 160px; padding: 13px 15px;
      background: #12141b; color: #e6e8eb; border: 1px solid #2a3040;
      border-radius: 12px; font: inherit;
    }
    textarea:focus { outline: none; border-color: #2b6cff; }
    button.send {
      background: linear-gradient(135deg, #2b6cff, #4f7dff); color: #fff; border: none;
      border-radius: 12px; padding: 0 22px; cursor: pointer; font-weight: 600;
    }
    button.send:disabled { opacity: .5; cursor: default; }

    /* ---- HERO state (default: no conversation yet) ---- */
    body:not(.chat) .stage {
      justify-content: center; align-items: center; gap: 18px; padding: 24px;
    }
    body:not(.chat) .stage::before {
      content: ""; position: absolute; z-index: 0; pointer-events: none;
      width: 640px; height: 340px; top: 6%; left: 50%; transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(96, 92, 255, 0.20), transparent 70%);
      filter: blur(8px);
    }
    body:not(.chat) .hero-head,
    body:not(.chat) .dock { position: relative; z-index: 1; }
    body:not(.chat) #thread { display: none; }
    body:not(.chat) .dock { max-width: 600px; }

    /* ---- CHAT state (a conversation exists) ---- */
    body.chat .hero-head { display: none; }
    body.chat #thread { flex: 1; }
    body.chat .dock {
      max-width: 860px; margin: 0 auto; padding: 12px 20px 18px;
      border-top: 1px solid #1b1f2b;
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero-head { transition: opacity .2s ease; }
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">
      <span class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M5 4v3.5a5.5 5.5 0 0 0 5.5 5.5H12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M19 4v3.5A5.5 5.5 0 0 1 13.5 13H12" stroke="#dbe4ff" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 13v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M9 16.5l3 3 3-3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="name">
        <b>Fusion</b>
        <small>A panel of models, one combined answer</small>
      </span>
    </span>
    <div class="spacer"></div>
    <button class="ghost" hx-post="/tasks/fusion/new"
            hx-target="#thread" hx-swap="innerHTML">New chat</button>
  </header>

  <main class="stage">
    <div class="hero-head">
      <h2>What should the panel answer?</h2>
      <p>Pick your models, ask once, and get one combined answer.</p>
    </div>

    <div id="thread"></div>

    <div class="dock">
      <div id="picker" class="picker" hx-get="/tasks/fusion/picker"
           hx-trigger="load" hx-swap="outerHTML"></div>

      <form class="composer" hx-post="/tasks/fusion/send"
            hx-target="#thread" hx-swap="beforeend"
            hx-on::after-request="if(event.detail.successful){this.querySelector('textarea').value='';}">
        <textarea name="message" placeholder="Ask Fusion..."
                  autocomplete="off" required></textarea>
        <button class="send" type="submit">Send</button>
      </form>
    </div>
  </main>

  <script>
    // Toggle the hero/chat layout based on whether the thread holds any message.
    function syncLayout() {
      document.body.classList.toggle(
        'chat', !!document.querySelector('#thread .msg'));
    }

    // Auth: attach the OWUI login token as a Bearer header on HTMX requests.
    // The SSE stream (EventSource) cannot send headers, so it relies on the
    // same-origin OWUI cookie instead; that path needs nothing here.
    document.body.addEventListener('htmx:configRequest', function (e) {
      var token = localStorage.getItem('token');
      if (token) { e.detail.headers['Authorization'] = 'Bearer ' + token; }
    });

    // Add-model modal (the modal markup is re-rendered inside #picker on every
    // swap, so these helpers are global and look the element up by id each time).
    function openAddModal() {
      var m = document.getElementById('addModal');
      if (m) {
        m.classList.add('open');
        var s = m.querySelector('.msearch');
        if (s) { s.value = ''; s.focus(); }
        filterModels('');
      }
    }
    function closeAddModal() {
      var m = document.getElementById('addModal');
      if (m) { m.classList.remove('open'); }
    }
    function filterModels(q) {
      q = (q || '').toLowerCase();
      var rows = document.querySelectorAll('#addModal .mrow');
      for (var i = 0; i < rows.length; i++) {
        var name = rows[i].getAttribute('data-name') || '';
        rows[i].style.display = name.indexOf(q) >= 0 ? '' : 'none';
      }
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeAddModal(); }
    });

    // Enter sends, Shift+Enter makes a newline.
    var ta = document.querySelector('textarea');
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.querySelector('form.composer button.send').click();
      }
    });

    // Disable Send while a turn is streaming; re-enable when the stream closes.
    var sendBtn = document.querySelector('button.send');
    document.body.addEventListener('htmx:afterSwap', function () {
      syncLayout();
      var streaming = document.querySelector('.bubble[sse-connect]');
      sendBtn.disabled = !!streaming;
      var thread = document.getElementById('thread');
      thread.scrollTop = thread.scrollHeight;
    });
    // htmx SSE ext dispatches htmx:sseClose when sse-close fires.
    document.body.addEventListener('htmx:sseClose', function () {
      sendBtn.disabled = false;
    });
    // Keep the view pinned to the latest tokens as they stream in.
    document.body.addEventListener('htmx:sseMessage', function () {
      var thread = document.getElementById('thread');
      thread.scrollTop = thread.scrollHeight;
    });

    // If auth fails, tell the user to sign in.
    document.body.addEventListener('htmx:responseError', function (e) {
      if (e.detail.xhr && (e.detail.xhr.status === 401 || e.detail.xhr.status === 403)) {
        var thread = document.getElementById('thread');
        thread.insertAdjacentHTML('beforeend',
          '<div class="msg system"><div class="bubble">Please sign in to Open WebUI and reload this page.</div></div>');
        syncLayout();
      }
    });

    syncLayout();
  </script>
</body>
</html>
